:root { --fundo: #0c0e0a; --fundo2: #13160f; --cartao: #171a13; --linha: #2a2e24; --linha2: #3a3f33;

<script>
(function () {

    { id: 'prev', dim: 'int', t: 'No fim do mês, a previsão de vendas bate?',

    coach: { t: 'Crie o ritual de 20 minutos por semana', p: [['Semana 1', 'Para cada vendedor, separe um trecho real de reunião: o que foi bem e uma pergunta que faltou.'], ['Semanas 2 a 4', 'Registre a evolução numa planilha simples: critério, nota e data. O um a um passa a ter dado.']], sc: 'entrega cada reunião com nota, critérios justificados com o que foi dito e a pergunta que faltou.' },
    met: { t: 'Escolha uma régua e use em toda reunião', p: [['Semana 1', 'Defina 5 critérios: dor, decisor, orçamento, prazo e próximo passo com data.'], ['Semanas 2 a 4', 'Ao fim de cada reunião, o vendedor marca o que cobriu. Você confere uma amostra por semana.']], sc: 'aplica BANT, MEDDIC, SPIN ou a metodologia da sua empresa a todas as reuniões, sem ninguém preencher nada.' },
    int: { t: 'Pare de aceitar "preço" como motivo de perda', p: [['Semana 1', 'Para cada perda, registre a frase do cliente que mais pesou na decisão.'], ['Semanas 2 a 4', 'No fim do mês, junte as frases e ajuste o discurso e o treino do time.']], sc: 'responde "o que travou essa negociação?" citando a reunião, a data e o trecho da conversa.' },
  };
  var NIVEIS = [
    [0, 'Às cegas', 'A maior parte do que decide as vendas acontece sem ninguém ver, e o que é visto não vira padrão.'],

    [60, 'Com faróis', 'Boa base de gestão. O que falta é escala: ver tudo, com a mesma régua, sem depender do seu tempo.'],
    [80, 'Com radar', 'Operação madura. O ganho agora está nos detalhes: quais critérios e frases mais pesam no fechamento.'],
  ];

  /* Estado (guardado no navegador para quem recarregar a página). */
  var S = { passo: -1, nums: { v: 8, r: 8, c: 6, t: 15000 }, resp: {}, lead: null, analise: false, sim: 10 };
  try { var salvo = JSON.parse(localStorage.getItem('raio-x') || 'null'); if (salvo && salvo.nums) S = Object.assign(S, salvo); } catch (e) {}
  var guardar = function () { try { localStorage.setItem('raio-x', JSON.stringify(S)); } catch (e) {} };

  var reunioes = function () { return S.nums.v * S.nums.r * SEMANAS; };
  var reunioesVendedor = function () { return S.nums.r * SEMANAS; };
  var horasTudo = function () { return reunioes() * MIN_REUNIAO / 60; };
  var visFrac = function () { return S.resp.vis == null ? null : VIS[S.resp.vis]; };
  var dimNota = function (d) { var qs = QS.filter(function (q) { return q.dim === d && S.resp[q.id] != null; }); if (!qs.length) return 0; return Math.round(qs.reduce(function (a, q) { return a + S.resp[q.id]; }, 0) / qs.length / 3 * 100); };
  var nota = function () { var ds = Object.keys(DIMS); return Math.round(ds.reduce(function (a, d) { return a + dimNota(d); }, 0) / ds.length); };
  var nivel = function (n) { var r = NIVEIS[0]; NIVEIS.forEach(function (x) { if (n >= x[0]) r = x; }); return r; };
  var faixa = function (n) { return n < 40 ? 0 : n < 70 ? 1 : 2; };
  var cor = function (n) { return n < 40 ? 'var(--ruim)' : n < 70 ? 'var(--medio)' : 'var(--bom)'; };
  var tamanhoTime = function (v) { return v <= 1 ? 'Só eu' : v <= 5 ? '2 a 5' : v <= 15 ? '6 a 15' : v <= 50 ? '16 a 50' : 'Mais de 50'; };

  /* ───── Painel: um ponto por reunião (ou por grupo de reuniões, se forem muitas) ───── */
  var cv = $('#tela'), ctx = cv.getContext('2d'), pontos = [], porPonto = 1, alvoVis = 1, raf = 0;
  function semente(i) { var x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }
  function montarPontos() {
    var w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var total = Math.max(1, Math.round(reunioes()));
    var max = Math.max(60, Math.floor(w * h / (w < 500 ? 170 : 150)));
    porPonto = Math.max(1, Math.ceil(total / max));
    var n = Math.ceil(total / porPonto), ratio = w / h, cols = Math.max(1, Math.round(Math.sqrt(n * ratio))), rows = Math.ceil(n / cols);
    var gx = w / (cols + 1), gy = h / (rows + 1), raio = Math.max(1.4, Math.min(gx, gy) * 0.3);
    var antigos = pontos; pontos = [];
    for (var i = 0; i < n; i++) {

      var p = { x: gx * (c + 1), y: gy * (r + 1), r: raio, ordem: semente(i + 1), a: antigos[i] ? antigos[i].a : 0, nasce: antigos[i] ? 1 : 0, atraso: antigos[i] ? 0 : (i / n) * 0.6 };

  }
  function desenhar() {

    ctx.clearRect(0, 0, w, h);

      var p = pontos[i];
      if (p.atraso > 0) { p.atraso -= 0.016; ativo = true; continue; }
      if (p.nasce < 1) { p.nasce = Math.min(1, p.nasce + 0.06); ativo = true; }

      if (Math.abs(p.a - alvo) > 0.01) { p.a += (alvo - p.a) * (0.05 + p.ordem * 0.08); ativo = true; } else p.a = alvo;
      var rr = p.r * (0.4 + 0.6 * p.nasce);

      ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 6.283);
      var g = Math.round(58 + (212 - 58) * p.a), gg = Math.round(63 + (249 - 63) * p.a), b = Math.round(51 + (105 - 51) * p.a);
      ctx.fillStyle = 'rgba(' + g + ',' + gg + ',' + b + ',' + p.nasce + ')'; ctx.fill();
    }

  }
  function animar() { if (!raf) raf = requestAnimationFrame(desenhar); }
  function atualizarPainel() {

  }
  var redimensionar = 0;
  window.addEventListener('resize', function () { clearTimeout(redimensionar); redimensionar = setTimeout(montarPontos, 150); });

  /* ───── Telas ───── */
  var C = $('#conteudo'), TOTAL = 1 + QS.length;

    C.querySelectorAll('input[type=range]').forEach(pintarRange);

  function pintarRange(el) { el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min) * 100) + '%'); }
  function setNum(id, v, origem) {
    var lim = { v: [1, 500], r: [1, 60], c: [0, 5000], t: [0, 1e9] }[id];
    v = Math.max(lim[0], Math.min(lim[1], Math.round(+v || 0)));

    C.querySelectorAll('[data-chip]').forEach(function (b) { b.classList.toggle('on', +b.dataset.chip === S.nums.t); });
    if (id === 'v' || id === 'r') { clearTimeout(setNum.t); setNum.t = setTimeout(montarPontos, 60); }
    atualizarPainel();
  }

  function telaPergunta(k) {
    var q = QS[k], sel = S.resp[q.id];
    C.innerHTML = '<section class="tela">' + topoPasso(k + 1)
      + '<h2 class="pergunta">' + esc(q.t) + '</h2>' + (q.s ? '<p class="ajuda">' + esc(q.s) + '</p>' : '')
      + '<div class="ops" role="group" aria-label="' + esc(q.t) + '">' + q.ops.map(function (o, i) {
        return '<button type="button" class="op" data-op="' + i + '" aria-pressed="' + (sel === i) + '"><kbd>' + 'ABCD'[i] + '</kbd><span>' + esc(o[0]) + (o[1] ? '<small>' + esc(o[1]) + '</small>' : '') + '</span></button>';
      }).join('') + '</div><div id="ins"></div></section>';
  }
  function responder(i) {
    var k = S.passo - 1, q = QS[k]; if (!q || telaPergunta.trava) return;
    S.resp[q.id] = i; guardar();
    C.querySelectorAll('[data-op]').forEach(function (b) { b.setAttribute('aria-pressed', +b.dataset.op === i); });
    $('#ins').innerHTML = '<p class="insight">' + esc(q.ins(i)) + '</p>';
    atualizarPainel();
    if (window.fbq && k === QS.length - 1) fbq('trackCustom', 'RaioXConcluido');
    telaPergunta.trava = true;
    setTimeout(function () { telaPergunta.trava = false; ir(S.passo + 1); }, q.id === 'vis' ? 2300 : 1500);
  }

  /* Prévia: nota e número principal, sem cadastro. O formulário libera o relatório completo. */
  function anelHtml(n) {
    var c = 2 * Math.PI * 46;
    return '<div class="anel"><svg viewBox="0 0 112 112"><circle class="f" cx="56" cy="56" r="46"/><circle class="v" cx="56" cy="56" r="46" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + c.toFixed(1) + '" data-alvo="' + (c * (1 - n / 100)).toFixed(1) + '" style="stroke:' + cor(n) + '"/></svg><b><span>' + n + '<small>de 100</small></span></b></div>';
  }
  function animarAneis() { setTimeout(function () { C.querySelectorAll('.anel .v').forEach(function (el) { el.style.strokeDashoffset = el.dataset.alvo; }); C.querySelectorAll('.dim .barra i').forEach(function (el) { el.style.width = el.dataset.w + '%'; }); }, 80); }
  function manchete() {
    var n = reunioes(), f = visFrac() || 0, rec = S.nums.c * S.nums.t;
    return '<p class="hl">De <em>' + fmt(n) + '</em> reuniões por mês, a liderança acompanha cerca de <em>' + fmt(n * f) + '</em>.</p>'
      + '<p class="hl-sub">As outras ' + fmt(n * (1 - f)) + ' acontecem sem ninguém além do vendedor ouvir.' + (rec > 0 ? ' É nelas que se decide boa parte dos ' + brlCurto(rec) + ' que o time fecha por mês.' : '') + '</p>';
  }
  function telaPrevia() {
    var n = nota(), nv = nivel(n);
    C.innerHTML = '<section class="tela">'
      + '<div class="passo-topo"><button class="voltar" type="button" data-voltar>← Revisar respostas</button></div>'
      + manchete()
      + '<div class="nota-anel">' + anelHtml(n) + '<div><span class="mono" style="color:var(--dim2)">Seu nível</span><p class="nivel">' + nv[1] + '</p><p class="nivel-txt">' + nv[2] + '</p></div></div>'
      + '<form class="form" id="form" novalidate><h2>Seu raio-x completo está pronto</h2>'
      + '<ul><li>Nota em cada dimensão e o que ela significa</li><li>Simulação do que está em jogo, com os seus números</li><li>Plano de 30 dias com 3 prioridades</li><li>Versão para salvar em PDF e levar para o time</li></ul>'
      + '<div class="campos"><label>Nome<input name="nome" autocomplete="name" required maxlength="80"></label>'
      + '<div class="dois"><label>E-mail de trabalho<input name="email" type="email" autocomplete="email" inputmode="email" required maxlength="120"></label>'
      + '<label>WhatsApp<input name="whatsapp" type="tel" autocomplete="tel" inputmode="tel" placeholder="(00) 00000-0000" required maxlength="16"></label></div>'
      + '<div class="dois"><label>Empresa<input name="empresa" autocomplete="organization" required maxlength="120"></label>'
      + '<label>Seu cargo<select name="cargo" required><option value="" disabled selected>Selecione</option><option>Sócio(a) ou CEO</option><option>Diretor(a) comercial</option><option>Gerente ou coordenador(a) comercial</option><option>Vendedor(a), SDR ou closer</option><option>Outro</option></select></label></div>'
      + '<label class="marcar"><input type="checkbox" name="analise"' + (S.analise ? ' checked' : '') + '><span><b>Quero a análise gratuita de 3 agendas reais do meu time.</b> O Sales Coach avalia 3 reuniões de verdade e a gente apresenta o resultado em 30 minutos.</span></label>'
      + '<label class="hp" aria-hidden="true">Site<input name="site" tabindex="-1" autocomplete="off"></label>'
      + '<p class="msg" id="msg" role="alert"></p>'
      + '<button class="cta" type="submit" id="enviar"><span>Ver meu raio-x completo</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>'
      + '<p class="lgpd">Ao enviar, você aceita ser contatado pela NEXA sobre o Sales Coach. Sem spam: pode pedir para sair quando quiser. <a href="/privacidade/">Política de privacidade</a>.</p></div></form></section>';
    animarAneis(); ligarForm();
  }

  function resumoDiag() {
    var o = { nota: nota(), nivel: nivel(nota())[1], vendedores: S.nums.v, reunioesSemana: S.nums.r, contratosMes: S.nums.c, ticket: S.nums.t,
      reunioesMes: Math.round(reunioes()), acompanhadasMes: Math.round(reunioes() * (visFrac() || 0)), dims: {}, respostas: {}, analise: !!S.analise };
    Object.keys(DIMS).forEach(function (d) { o.dims[d] = dimNota(d); });
    QS.forEach(function (q) { if (S.resp[q.id] != null) o.respostas[q.id] = q.ops[S.resp[q.id]][0]; });
    return o;
  }
  function enviar(corpo) {
    var utm = {}; try { utm = JSON.parse(sessionStorage.getItem('lp-utm') || '{}'); } catch (e) {}
    utm.pagina = location.pathname;
    corpo.material = window.LP.material; corpo.utm = utm; corpo.diagnostico = resumoDiag();
    return fetch(window.LP.api, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || !j.ok) throw { msg: j.erro, campo: j.campo }; return j; }); });
  }
  function ligarForm() {
    var f = $('#form'), msg = $('#msg'), bt = $('#enviar'), tel = f.whatsapp;
    tel.addEventListener('input', function () {
      var d = tel.value.replace(/\D/g, '').slice(0, 11), s = d;
      if (d.length > 2) s = '(' + d.slice(0, 2) + ') ' + d.slice(2);
      if (d.length > 7) s = '(' + d.slice(0, 2) + ') ' + d.slice(2, d.length - 4) + '-' + d.slice(-4);
      tel.value = s;
    });
    var regras = {
      nome: function (v) { return v.trim().length >= 2 || 'Informe seu nome.'; },
      email: function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) || 'Confira o e-mail.'; },
      whatsapp: function (v) { return v.replace(/\D/g, '').length >= 10 || 'Informe o WhatsApp com DDD.'; },
      empresa: function (v) { return v.trim().length >= 2 || 'Informe a empresa.'; },
      cargo: function (v) { return !!v || 'Selecione seu cargo.'; },
    };
    Object.keys(regras).forEach(function (k) { f[k].addEventListener('input', function () { f[k].classList.remove('invalido'); msg.textContent = ''; }); });
    f.analise.addEventListener('change', function () { S.analise = f.analise.checked; guardar(); });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var primeiro = null;
      Object.keys(regras).forEach(function (k) { var r = regras[k](f[k].value); if (r !== true) { f[k].classList.add('invalido'); if (!primeiro) { primeiro = f[k]; msg.textContent = r; } } });
      if (primeiro) { primeiro.focus(); return; }
      S.analise = f.analise.checked;
      bt.disabled = true; bt.firstChild.textContent = 'Montando seu raio-x…'; msg.textContent = '';
      enviar({ nome: f.nome.value, email: f.email.value, whatsapp: f.whatsapp.value, empresa: f.empresa.value, cargo: f.cargo.value, tamanho: tamanhoTime(S.nums.v), site: f.site.value })
        .then(function () {
          var id = 'lead-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
          if (window.fbq) fbq('track', 'Lead', { content_name: 'Raio-X das reuniões', value: 0, currency: 'BRL' }, { eventID: id });
          try { (window.dataLayer = window.dataLayer || []).push({ event: 'generate_lead', formulario: 'raio-x-reunioes', event_id: id }); } catch (er) {}
          S.lead = { nome: f.nome.value.trim().split(/\s+/)[0], email: f.email.value.trim(), empresa: f.empresa.value.trim(), em: new Date().toISOString() }; S.analisePedida = S.analise;
          ir(QS.length + 1);
        })
        .catch(function (er) {
          bt.disabled = false; bt.firstChild.textContent = 'Ver meu raio-x completo';
          msg.textContent = (er && er.msg) || 'Não foi possível enviar agora. Confira a conexão e tente de novo.';
          if (er && er.campo && f[er.campo]) { f[er.campo].classList.add('invalido'); f[er.campo].focus(); }
        });
    });
  }

  /* Relatório completo. */
  function simHtml() {
    var p = S.sim, extra = S.nums.c * p / 100, ano = extra * S.nums.t * 12;
    return '<div class="sim"><div class="l"><label for="simR">Se as mesmas reuniões convertessem</label><b id="simP">+' + p + '%</b></div>'
      + '<input type="range" id="simR" min="5" max="40" step="5" value="' + p + '" style="--p:' + ((p - 5) / 35 * 100) + '%">'
      + '<p class="res" id="simRes">' + (S.nums.c > 0 && S.nums.t > 0 ? '<em>+' + brlCurto(ano) + '</em> por ano' : 'Preencha contratos e valor médio para simular') + '</p>'
      + '<small id="simTxt">' + (S.nums.c > 0 ? '+' + extra.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' contratos por mês, sem nenhuma reunião a mais. ' : '') + 'Conta simples com os seus números: mesma quantidade de reuniões, taxa de conversão ' + p + '% maior. É uma simulação, não uma promessa de resultado.</small></div>';
  }
  function telaRelatorio() {
    var n = nota(), nv = nivel(n), r = reunioes(), f = visFrac() || 0, dims = Object.keys(DIMS);
    var piores = dims.slice().sort(function (a, b) { return dimNota(a) - dimNota(b); }).slice(0, 3);
    var porContrato = S.nums.c > 0 ? r / S.nums.c : 0, nome = S.lead && S.lead.nome ? S.lead.nome : '';
    var hoje = new Date().toLocaleDateString('pt-BR');
    C.innerHTML = '<section class="tela rel">'
      + '<div class="passo-topo"><button class="voltar" type="button" data-voltar>← Revisar respostas</button><span class="contador">' + hoje + '</span></div>'
      + '<div><span class="mono" style="color:var(--lima)">Raio-X das reuniões' + (S.lead && S.lead.empresa ? ' · ' + esc(S.lead.empresa) : '') + '</span>' + manchete().replace('<p class="hl">', '<p class="hl" style="margin-top:10px">') + '</div>'
      + '<div class="bloco"><div class="rel-topo">' + anelHtml(n) + '<div><span class="mono" style="color:var(--dim2)">Nível</span><p class="nivel">' + nv[1] + '</p><p class="nivel-txt">' + nv[2] + '</p></div></div>'
      + '<div class="dims">' + dims.map(function (d) { var v = dimNota(d); return '<div class="dim"><div class="t"><b>' + DIMS[d].nome + '</b><span>' + v + '</span></div><div class="barra"><i data-w="' + Math.max(3, v) + '" style="background:' + cor(v) + '"></i></div><p>' + DIMS[d].txt[faixa(v)] + '</p></div>'; }).join('') + '</div></div>'
      + '<div class="bloco"><span class="mono">O que está em jogo</span><h2>Os seus números, <em>de outro ângulo.</em></h2>'
      + '<div class="cards">'
      + '<div class="card"><b>' + fmt(r) + '</b><span>reuniões por mês com clientes</span></div>'
      + '<div class="card"><b>' + fmt(r * (1 - f)) + '</b><span>sem ninguém da liderança ouvir</span></div>'
      + '<div class="card"><b>' + (porContrato ? fmt(porContrato) : '—') + '</b><span>reuniões para fechar 1 contrato</span></div>'
      + '<div class="card"><b>' + fmt(horasTudo()) + ' h</b><span>para ouvir tudo, todo mês (' + MIN_REUNIAO + ' min cada)</span></div>'
      + '</div>' + simHtml() + '</div>'
      + '<div class="bloco"><span class="mono">Plano de 30 dias</span><h2>' + (nome ? esc(nome) + ', comece ' : 'Comece ') + '<em>por aqui.</em></h2><p class="p">As 3 dimensões com a nota mais baixa, em ações que você aplica com ou sem ferramenta.</p>'
      + '<div class="plano">' + piores.map(function (d) { var a = PLANO[d]; return '<div class="acao"><h3>' + a.t + '</h3><ol>' + a.p.map(function (x) { return '<li><span>' + x[0] + '</span>' + x[1] + '</li>'; }).join('') + '</ol><p class="sc"><b>Com o Sales Coach:</b> ' + a.sc + '</p></div>'; }).join('') + '</div></div>'
      + '<div class="oferta" id="oferta"><span class="mono">Grátis · para o seu time</span><h2>Análise de 3 agendas reais do seu time.</h2>'
      + '<p>O raio-x mostra onde olhar. A análise mostra o que está acontecendo de verdade: o Sales Coach avalia 3 reuniões do seu time e a gente apresenta o resultado com você em 30 minutos.</p>'
      + '<ul><li>Nota de 0 a 100 em cada reunião, com a metodologia que você escolher</li><li>Os critérios justificados com o que foi dito na conversa</li><li>Objeções, temperatura da oportunidade e próximos passos</li><li>Gravações do Meet, Teams ou Zoom, sem bot na sala</li></ul>'
      + (S.analisePedida ? '<p class="ok">Pedido recebido. A Dandara, executiva da NEXA, te chama no WhatsApp em até 1 dia útil para combinar as 3 agendas. <a href="https://wa.me/' + window.LP.whatsapp + '?text=' + encodeURIComponent('Oi, Dandara! Fiz o Raio-X das reuniões e pedi a análise gratuita de 3 agendas.') + '" target="_blank" rel="noopener">Prefere chamar agora?</a></p>'
        : '<button class="cta" type="button" data-analise>Quero a análise gratuita<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><p class="msg" id="msgAn" style="margin-top:10px;color:#9a2b18"></p>')
      + '</div>'
      + '<div class="acoes-fim"><button class="btn2" type="button" data-imprimir>Salvar em PDF</button><button class="btn2" type="button" data-refazer>Refazer o raio-x</button></div>'
      + '</section>';
    animarAneis();
  }
  function pedirAnalise(bt) {
    if (!S.lead) return;
    bt.disabled = true; bt.firstChild.textContent = 'Enviando…';
    S.analise = true;
    enviar({ atualizar: true, nome: S.lead.nome, email: S.lead.email, empresa: S.lead.empresa })
      .then(function () { S.analisePedida = true; guardar(); if (window.fbq) fbq('track', 'Contact', { content_name: 'Análise de 3 agendas' }); telaRelatorio(); $('#oferta').scrollIntoView({ behavior: 'smooth', block: 'center' }); })
      .catch(function (er) { bt.disabled = false; bt.firstChild.textContent = 'Quero a análise gratuita'; $('#msgAn').textContent = (er && er.msg) || 'Não foi possível enviar agora. Tente de novo.'; });
  }

  /* ───── Eventos ───── */
  C.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-comecar')) { var faltam = QS.findIndex(function (q) { return S.resp[q.id] == null; }); ir(Object.keys(S.resp).length ? (faltam < 0 ? QS.length + 1 : faltam + 1) : 0); }
    else if (b.hasAttribute('data-proximo')) ir(S.passo + 1);
    else if (b.hasAttribute('data-voltar')) ir(S.passo > QS.length ? QS.length : S.passo - 1);
    else if (b.dataset.op != null) responder(+b.dataset.op);
    else if (b.dataset.chip) setNum('t', +b.dataset.chip);
    else if (b.hasAttribute('data-analise')) pedirAnalise(b);
    else if (b.hasAttribute('data-imprimir')) window.print();
    else if (b.hasAttribute('data-refazer')) { S.resp = {}; S.analisePedida = false; ir(0); }
  });
  C.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset.num) { pintarRange(el); setNum(el.dataset.num, el.value, 'range'); }
    else if (el.dataset.txt) { var d = el.value.replace(/\D/g, ''); setNum(el.dataset.txt, d, 'txt'); }
    else if (el.id === 'simR') { S.sim = +el.value; guardar(); pintarRange(el); var tmp = document.createElement('div'); tmp.innerHTML = simHtml(); $('#simP').textContent = '+' + S.sim + '%'; $('#simRes').innerHTML = $('#simRes', tmp).innerHTML; $('#simTxt').textContent = $('#simTxt', tmp).textContent; }
  });
  C.addEventListener('focusout', function (e) { if (e.target.dataset && e.target.dataset.txt) e.target.value = fmt(S.nums[e.target.dataset.txt]); });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (S.passo >= 1 && S.passo <= QS.length) { var i = 'abcd1234'.indexOf(e.key.toLowerCase()); if (i >= 0) { e.preventDefault(); responder(i % 4); } }
    if (e.key === 'Enter' && S.passo === 0) ir(1);
  });

  ir(S.passo > QS.length && !S.lead && window.LP.gate ? QS.length + 1 : Math.max(-1, Math.min(S.passo, QS.length + 1)), false);
  if (S.passo >= 0) setTimeout(function () { window.scrollTo(0, 0); }, 0);
})();
</script>
</body>
</html>
