<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Fundo Meet escritório</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
 *{margin:0;box-sizing:border-box} html,body{width:1920px;height:1080px;overflow:hidden}
 .f{position:relative;width:1920px;height:1080px;overflow:hidden;background:#3a2a1e}
 .foto{position:absolute;left:-40px;top:-30px;width:2000px;height:1140px;object-fit:cover;object-position:50% 40%;filter:blur(5px) saturate(.92) brightness(.96)}
 .tom{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 45%, transparent 55%, rgba(40,25,12,.28) 100%)}
 .placa{position:absolute;right:120px;top:120px;display:flex;align-items:center;gap:22px;padding:22px 30px;border-radius:14px;
   background:rgba(250,246,238,.82);backdrop-filter:blur(6px);box-shadow:0 18px 40px -18px rgba(40,25,12,.55), inset 0 0 0 1px rgba(255,255,255,.6)}
 .nexa{display:flex;align-items:center;gap:8px}
 .nexa svg{width:120px;height:22px} .nexa path{fill:none;stroke:#10120e;stroke-width:12;stroke-linecap:round}
 .nexa i{width:7px;height:7px;border-radius:50%;background:#b9e04a;box-shadow:0 0 0 3px rgba(212,249,105,.35);margin-top:13px}
 .sep{width:1px;height:32px;background:rgba(16,18,14,.2)}
 .sc{display:flex;align-items:center;gap:10px;font:500 25px/1 'Space Grotesk',sans-serif;letter-spacing:-.02em;color:#10120e}
 .sc img{width:30px}
</style></head><body><div class="f">
 <img class="foto" src="img/escritorio.jpg" alt="">
 <div class="tom"></div>
 <div class="placa">
  <div class="nexa"><svg viewBox="0 0 800 150"><path d="M8 139V12L175 139V12M200 12H366M200 12V139H366M200 75H366M390 12L558 139M558 12L390 139M580 139L685 12L792 139M618 95H755"/></svg><i></i></div>
  <div class="sep"></div>
  <div class="sc"><img src="img/sc-icon.png" alt="">Sales Coach</div>
 </div>
</div></body></html>
