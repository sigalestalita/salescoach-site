<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../serie-nowdays/inter.css">
<link rel="stylesheet" href="../serie-nowdays/instrument.css">
<style>
  :root { --osso: #f3f4ee; --tinta: #10120e; --lima: #d4f969; --oliva: #46590a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: 'Inter Tight', sans-serif; position: relative; color: var(--tinta); }
  .abs { position: absolute; }
  .logo { position: absolute; top: 84px; left: 90px; width: 140px; height: 26px; }
  h1 { position: absolute; left: 90px; top: 170px; font-size: 92px; font-weight: 700; line-height: .98; letter-spacing: -.045em; z-index: 5; }
  h1 .leve { font-weight: 400; }
  h1 .sub { display: block; margin-top: 24px; font-size: 30px; font-weight: 400; letter-spacing: -.01em; line-height: 1.3; }
  .pessoa { position: absolute; bottom: 0; z-index: 3; }
  svg.vet { position: absolute; inset: 0; width: 1080px; height: 1350px; pointer-events: none; }
  .card { position: absolute; z-index: 6; background: #fff; border-radius: 22px; padding: 18px 24px 18px 18px; display: flex; align-items: center; gap: 16px;
    font-size: 25px; font-weight: 600; letter-spacing: -.01em; box-shadow: 0 18px 40px -16px rgba(16,18,14,.35); white-space: nowrap; }
  .card i { width: 40px; height: 40px; border-radius: 50%; background: var(--lima); display: grid; place-items: center; font-style: normal; font-size: 22px; font-weight: 800; }
  .card small { display: block; font-size: 17px; font-weight: 500; opacity: .55; margin-top: 2px; }
  .bal { position: absolute; z-index: 6; max-width: 520px; padding: 22px 28px; border-radius: 30px; font-size: 28px; line-height: 1.25; font-weight: 500; letter-spacing: -.01em;
    box-shadow: 0 18px 40px -18px rgba(16,18,14,.4); }
  .bal .h { display: block; font-size: 17px; font-weight: 600; opacity: .55; margin-top: 8px; letter-spacing: .02em; }
  .bal.ent { background: #fff; border-bottom-left-radius: 8px; }
  .bal.sai { background: var(--tinta); color: var(--osso); border-bottom-right-radius: 8px; }
  .bal.sai .h { color: var(--lima); opacity: 1; }
  .tag { position: absolute; z-index: 6; padding: 10px 20px; border-radius: 999px; font-size: 20px; font-weight: 600; letter-spacing: .02em; }
  .rod { position: absolute; left: 90px; bottom: 60px; z-index: 7; font-size: 19px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
const logo = (cor) => `<svg class="logo" viewBox="0 0 800 150"><path fill="none" stroke="${cor}" stroke-width="15" stroke-linecap="round" d="M8 139V12L175 139V12M200 12H366M200 12V139H366M200 75H366M390 12L558 139M558 12L390 139M580 139L685 12L792 139M618 95H755"/></svg>`;
const brilho = (x, y, s, cor) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -40 C4 -10 10 -4 40 0 C10 4 4 10 0 40 C-4 10 -10 4 -40 0 C-10 -4 -4 -10 0 -40Z" fill="${cor}"/>`;

const P = {
  // 1 · osso · homem pensando + cards de tarefas feitas
  v1: () => ({ fundo: '#f3f4ee', html: `
    <svg class="vet" viewBox="0 0 1080 1350">
      <circle cx="760" cy="900" r="330" fill="#d4f969"/>
      <g stroke="#10120e" stroke-width="7" stroke-linecap="round"><path d="M906 300 l14 -40"/><path d="M944 320 l34 -26"/><path d="M958 362 l42 -4"/></g>
      ${brilho(150, 740, .9, '#46590a')}${brilho(1000, 640, .55, '#10120e')}
    </svg>
    ${logo('#10120e')}
    <h1>Seu time<br><span class="leve">pensa.</span><br>A IA<br><span class="leve">executa.</span></h1>
    <img class="pessoa" src="recortes/c.png" style="right:-170px;height:1000px">
    <div class="card" style="left:90px;top:800px"><i>✓</i><div>Proposta enviada<small>há 2 min</small></div></div>
    <div class="card" style="left:130px;top:920px"><i>✓</i><div>CRM atualizado<small>automático</small></div></div>
    <div class="card" style="left:90px;top:1040px"><i>✓</i><div>Follow-up agendado<small>amanhã, 9h</small></div></div>` }),

  // 2 · lima · mulher surpresa no celular + conversa às 23h
  v2: () => ({ fundo: '#d4f969', html: `
    <svg class="vet" viewBox="0 0 1080 1350">
      <path d="M640 520 C 900 470, 1110 640, 1040 900 C 980 1120, 760 1180, 600 1100" stroke="#10120e" stroke-width="6" fill="none" stroke-dasharray="2 18" stroke-linecap="round"/>
      <g stroke="#10120e" stroke-width="8" stroke-linecap="round"><path d="M520 470 l-26 -34"/><path d="M480 500 l-40 -14"/><path d="M560 452 l-6 -42"/></g>
      ${brilho(980, 300, .8, '#10120e')}${brilho(1020, 420, .4, '#46590a')}
    </svg>
    ${logo('#10120e')}
    <h1 style="font-size:78px">Seu cliente<br>chamou às 23h.<br><span class="leve">Alguém respondeu?</span></h1>
    <img class="pessoa" src="recortes/e.png" style="left:330px;height:860px">
    <div class="bal ent" style="left:70px;top:620px;max-width:430px">Oi! Ainda dá pra fechar hoje?<span class="h">23:04</span></div>
    <div class="bal sai" style="right:50px;top:1010px;max-width:520px">Dá sim! Já te mando a proposta 😊<span class="h">23:04 · assistente da sua empresa</span></div>` }),

  // 3 · tinta · mulher pensando + conhecimento da empresa ligado por linhas
  v3: () => ({ fundo: '#10120e', html: `
    <svg class="vet" viewBox="0 0 1080 1350">
      <circle cx="700" cy="760" r="300" fill="#46590a" opacity=".55"/>
      <g fill="none" stroke="#d4f969" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round">
        <path d="M640 600 C 520 560, 380 640, 300 720"/><path d="M650 620 C 560 700, 430 820, 330 900"/><path d="M660 640 C 620 820, 520 980, 420 1070"/>
      </g>
      <g fill="none" stroke="#d4f969" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
        <g transform="translate(230 690)"><rect x="0" y="0" width="64" height="80" rx="10"/><path d="M16 26h32M16 42h32M16 58h20"/></g>
        <g transform="translate(262 870)"><path d="M0 12 a12 12 0 0 1 12 -12 h52 a12 12 0 0 1 12 12 v34 a12 12 0 0 1 -12 12 h-34 l-18 16 v-16 h0 a12 12 0 0 1 -12 -12z"/></g>
        <g transform="translate(352 1040)"><path d="M0 64 V0 M0 64 H76"/><path d="M12 48 L32 28 L46 40 L70 12"/></g>
      </g>
      ${brilho(950, 330, .7, '#d4f969')}
    </svg>
    ${logo('#f3f4ee')}
    <h1 style="color:#f3f4ee;font-size:80px">E se a resposta<br>já estivesse<br><span style="color:#d4f969">na sua empresa?</span></h1>
    <img class="pessoa" src="recortes/h.png" style="right:-40px;height:860px">
    <div class="tag" style="left:90px;top:1170px;background:#d4f969;color:#10120e">Assistente treinado com os seus materiais</div>` }),

  // 4 · oliva · homem P&B + bússola/seta lima
  v4: () => ({ fundo: '#46590a', html: `
    <svg class="vet" viewBox="0 0 1080 1350">
      <circle cx="560" cy="880" r="360" fill="none" stroke="#d4f969" stroke-width="5"/>
      <circle cx="560" cy="880" r="300" fill="#d4f969"/>
      <path d="M170 1220 C 300 1000, 520 1060, 640 860 S 860 560, 960 520" stroke="#10120e" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M918 500 L 966 516 L 950 566" stroke="#10120e" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      ${brilho(180, 640, .6, '#d4f969')}${brilho(960, 1180, .5, '#d4f969')}
    </svg>
    ${logo('#f3f4ee')}
    <h1 style="color:#f3f4ee">IA acelera.<br><span style="color:#d4f969">Pessoas dão<br>direção.</span></h1>
    <img class="pessoa" src="recortes/i.png" style="left:220px;height:820px">` }),
};
const id = new URLSearchParams(location.search).get('p') || 'v1';
const p = P[id]();
document.body.style.background = p.fundo;
document.getElementById('raiz').innerHTML = p.html;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {}))));
</script>
</body>
</html>
