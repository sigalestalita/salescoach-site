<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sales Coach · 11 · A reunião inteira numa tela</title>
<link rel="stylesheet" href="post.css">
<style>
  /* Tela de análise: a prova mais forte do produto. O título fica curto
     para o print ficar grande. */
  .head { margin-top: 0; }
  .head .h2 { margin-top: 14px; }
  .head .after { margin-top: 18px; font-size: 30px; }
  /* Com o print antes do texto, ele entra pelo alto do quadro e a
     sobra fica embaixo, sob o título. */
  .grow.top { flex-grow: .3; }
  .shot { margin-bottom: 42px; }
  /* Corta a coluna do SPIN e a sobra de baixo: sem isso o print inteiro
     encolhe para 924px e as justificativas ficam ilegíveis no feed. */
  .win { height: 549px; }
  .win img { width: 1421px; margin: -12px 0 0 -16px; }
</style>
</head>
<body>
<div class="post bg-grid">
  <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
  <canvas class="stars"></canvas>

  <header class="brand">
    <img src="../../assets/mark-white.png" alt="Sales Coach">
    <span>Sales Coach</span>
    <em class="site" style="font-style:normal">salescoach.app.br</em>
  </header>

  <div class="grow top"></div>

  <div class="shot">
    <div class="chrome"><i></i><i></i><i></i><span>Análise · Demo · Atacado Norte</span></div>
    <div class="win"><img src="../../assets/app/analise.webp" alt="Score 91, temperatura muito quente e os critérios BANT e MEDDIC com a justificativa de cada nota"></div>
  </div>

  <div class="head">
    <div class="kicker">Depois da reunião</div>
    <h2 class="h2">Uma hora de conversa,<br><span class="grad">nesta tela.</span></h2>
    <p class="after">BANT, MEDDIC e SPIN — e a frase do lead<br>que justifica <b>cada nota</b>.</p>
  </div>

  <div class="grow" style="min-height:24px"></div>
</div>
<script src="stars.js"></script>
</body>
</html>
