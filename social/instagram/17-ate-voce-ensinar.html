<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sales Coach · 17 · Até você ensinar</title>
<link rel="stylesheet" href="post.css">
<style>
  /* Base de conhecimento: o print entra com a barra lateral para mostrar
     que isso é um produto, não um chat. */
  .head { margin-top: 22px; }
  .head .h2 { margin-top: 14px; }
  .head .after { margin-top: 18px; font-size: 29px; }
  .grow.top { flex-grow: 4; }
  .shot { margin-top: 34px; }
  /* Recorte de conhecimento.webp: mostra a base com os documentos da empresa no lugar do print inteiro, que
     encolhido para 924px ficaria ilegível no feed. */
  .win { height: 357px; }
  .win img { width: 936px; margin: -6px 0 0 -6px; }
</style>
</head>
<body>
<div class="post">
  <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
  <canvas class="stars"></canvas>

  <header class="brand">
    <img src="../../assets/mark-white.png" alt="Sales Coach">
    <span>Sales Coach</span>
    <em class="site" style="font-style:normal">salescoach.app.br</em>
  </header>

  <div class="grow top"></div>

  <div class="head">
    <div class="kicker">A base da sua empresa</div>
    <h2 class="h2">Ele não sabe vender.<br><span class="grad">Até você ensinar.</span></h2>
    <p class="after">Playbook, tabela de preços, portfólio e cases.<br>Um botão reprocessa tudo: <b>Treinar IA</b>.</p>
  </div>

  <div class="shot">
    <div class="chrome"><i></i><i></i><i></i><span>Base de conhecimento</span></div>
    <div class="win"><img src="../../assets/app/conhecimento.webp" alt="Tela da base de conhecimento com documentos da empresa carregados e o botão Treinar IA"></div>
  </div>

  <div class="grow" style="min-height:24px"></div>
</div>
<script src="stars.js"></script>
</body>
</html>
