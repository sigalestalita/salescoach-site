<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sales Coach · 15 · Você tirou 55</title>
<link rel="stylesheet" href="post.css">
<style>
  /* Nota do treino: 55, morno. O post inteiro existe para dizer que é
     melhor errar aqui. */
  .head { margin-top: 22px; }
  .head .h2 { margin-top: 14px; }
  .head .after { margin-top: 18px; font-size: 29px; }
  .grow.top { flex-grow: 4; }
  .shot { margin-top: 34px; }
  /* Recorte de treino-nota.webp: mostra os três cartões e os critérios da metodologia no lugar do print inteiro, que
     encolhido para 924px ficaria ilegível no feed. */
  .win { height: 304px; }
  .win img { width: 940px; margin: -6px 0 0 -9px; }
</style>
</head>
<body>
<div class="post">
  <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
  <canvas class="stars"></canvas>

  <header class="brand">
    <img src="../../assets/mark-white.png" alt="Sales Coach">
    <span>Sales Coach</span>
    <em class="site" style="font-style:normal">salescoach.app.br</em>
  </header>

  <div class="grow top"></div>

  <div class="head">
    <div class="kicker">Antes da reunião</div>
    <h2 class="h2">Você tirou 55.<br><span class="grad">Ainda bem que era treino.</span></h2>
    <p class="after">O simulado termina com nota pelos mesmos critérios<br>de uma reunião de verdade — e diz <b>o que faltou</b>.</p>
  </div>

  <div class="shot">
    <div class="chrome"><i></i><i></i><i></i><span>Resultado do treino · Porto Consultoria</span></div>
    <div class="win"><img src="../../assets/app/treino-nota.webp" alt="Avaliação do treino com score 55, temperatura morno, falas trocadas e os critérios da metodologia"></div>
  </div>

  <div class="grow" style="min-height:24px"></div>
</div>
<script src="stars.js"></script>
</body>
</html>
