<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sales Coach · 39 · Entra na reunião, sai no CRM</title>
<link rel="stylesheet" href="post.css">
<style>
  /* Os logos são os mesmos arquivos da seção Ecossistema do site, em uso
     nominativo. Ficam sobre pastilha clara porque vários são monocromáticos
     escuros e sumiriam no azul. */
  .grow.top { flex-grow: 1.45; }
  .head .h2 { margin-top: 16px; font-size: 56px; }
  .lado { margin-top: 44px; }
  .lado + .lado { margin-top: 34px; }
  .lado .rot { font-size: 21px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
  .marcas { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 14px; }
  .marcas span { display: flex; align-items: center; gap: 12px; padding: 14px 22px 14px 16px; border-radius: 18px; background: #fff; font-size: 22px; color: #0A1424; font-weight: 500; }
  .marcas img { width: 30px; height: 30px; object-fit: contain; }
  .seta { margin-top: 30px; font-size: 25px; color: var(--dim); }
  .seta b { font-weight: 500; color: #fff; }
</style>
</head>
<body>
<div class="post bg-brand">
  <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
  <canvas class="stars"></canvas>

  <header class="brand">
    <img src="../../assets/mark-white.png" alt="Sales Coach">
    <span>Sales Coach</span>
    <em class="site" style="font-style:normal">salescoach.app.br</em>
  </header>

  <div class="grow top"></div>

  <div class="head">
    <div class="kicker">Ecossistema</div>
    <h2 class="h2">Entra na reunião.<br><span class="grad">Sai no CRM.</span></h2>
  </div>

  <div class="lado">
    <div class="rot">Entra</div>
    <div class="marcas">
      <span><img src="../../assets/logos/googlemeet.svg" alt="">Google Meet</span>
      <span><img src="../../assets/logos/microsoftteams.svg" alt="">Microsoft Teams</span>
      <span><img src="../../assets/logos/zoom.svg" alt="">Zoom</span>
      <span><img src="../../assets/logos/googlecalendar.svg" alt="">Google Calendar</span>
    </div>
  </div>

  <div class="lado">
    <div class="rot">Sai</div>
    <div class="marcas">
      <span><img src="../../assets/logos/hubspot.svg" alt="">HubSpot</span>
      <span><img src="../../assets/logos/salesforce.svg" alt="">Salesforce</span>
      <span><img src="../../assets/logos/pipedrive.png" alt="">Pipedrive</span>
      <span><img src="../../assets/logos/rdstation.png" alt="">RD Station</span>
    </div>
  </div>

  <p class="seta">Resumo, próximos passos, temperatura e critérios vão para a oportunidade. <b>Sem ninguém digitar.</b></p>

  <div class="grow"></div>
</div>
<script src="stars.js"></script>
</body>
</html>
