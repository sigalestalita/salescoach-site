<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sales Coach · 12 · Fale agora</title>
<link rel="stylesheet" href="post.css">
<style>
  /* Painel da extensão: o recorte vai direto no cartão FALE AGORA, que é a
     única coisa que o vendedor olha no meio da reunião. */
  .head { margin-top: 20px; }
  .head .h2 { margin-top: 14px; }
  .head .after { margin-top: 18px; font-size: 29px; }
  .grow.top { flex-grow: 4; }
  .shot { margin-top: 32px; }
  /* Recorte de extensao.webp: mostra o cartão da objeção no lugar do print inteiro, que
     encolhido para 924px ficaria ilegível no feed. */
  .win { height: 578px; }
  .win img { width: 1163px; margin: -401px 0 0 -165px; }
</style>
</head>
<body>
<div class="post">
  <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
  <canvas class="stars"></canvas>

  <header class="brand">
    <img src="../../assets/mark-white.png" alt="Sales Coach">
    <span>Sales Coach</span>
    <em class="site" style="font-style:normal">salescoach.app.br</em>
  </header>

  <div class="grow top"></div>

  <div class="head">
    <div class="kicker">Durante a reunião</div>
    <h2 class="h2">A objeção entrou.<br><span class="grad">A resposta já está na tela.</span></h2>
    <p class="after">O painel da extensão, no Meet e no Teams.<br>Discreto: <b>só o vendedor vê</b>.</p>
  </div>

  <div class="shot">
    <div class="chrome"><i></i><i></i><i></i><span>Extensão Chrome · Google Meet</span></div>
    <div class="win"><img src="../../assets/app/extensao.webp" alt="Painel da extensão durante a reunião com a orientação Fale agora e a transcrição ao vivo"></div>
  </div>

  <div class="grow" style="min-height:24px"></div>
</div>
<script src="stars.js"></script>
</body>
</html>
