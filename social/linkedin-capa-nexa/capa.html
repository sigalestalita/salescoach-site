<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa LinkedIn NEXA</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f3f4ee; --txt: #10120e; --dim: #4f5547; --tom: #8b9479; --lime: #d4f969; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1128px; height: 191px; overflow: hidden; background: var(--bg); }
  .capa { position: relative; width: 1128px; height: 191px; overflow: hidden; color: var(--txt); background: var(--bg); }
  .fundo { position: absolute; inset: 0; background: var(--fundo) var(--pos, 0 60%) / var(--tam, 100% auto) no-repeat; }
  .veu { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(243,244,238,0) 35%, rgba(243,244,238,.4) 65%, rgba(243,244,238,.6) 100%); }
  .bloco { position: absolute; right: 54px; top: 50%; transform: translateY(-50%); text-align: right; }
  .marca { display: inline-flex; align-items: center; gap: 7px; }
  .marca svg { width: 92px; height: 17px; } .marca path { fill: none; stroke: var(--txt); stroke-width: 12; stroke-linecap: round; }
  .marca i { width: 5px; height: 5px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 2px rgba(212,249,105,.35), 0 0 10px var(--lime); margin-top: 10px; }
  h1 { margin-top: 16px; font: 300 33px/1 'Space Grotesk', sans-serif; letter-spacing: -.04em; white-space: nowrap; }
  h1 .tom { color: var(--tom); }
  .rodape { margin-top: 13px; font: 400 8.4px/1 'JetBrains Mono', monospace; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); opacity: .8; }
</style>
</head>
<body>
<div class="capa">
  <div class="fundo"></div>
  <div class="veu"></div>
  <div class="bloco">
    <div class="marca"><svg viewBox="0 0 800 150"><path d="M8 139V12L175 139V12M200 12H366M200 12V139H366M200 75H366M390 12L558 139M558 12L390 139M580 139L685 12L792 139M618 95H755"/></svg><i></i></div>
    <h1>Inteligência <span class="tom">que vira solução.</span></h1>
    <div class="rodape">Fábrica de soluções digitais</div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const c = document.querySelector('.fundo');
  c.style.setProperty('--fundo', `url("${q.get('bg') || 'img/seda.png'}")`);
  if (q.get('pos')) c.style.setProperty('--pos', q.get('pos'));
  if (q.get('tam')) c.style.setProperty('--tam', q.get('tam'));
  if (!q.has('semflip')) c.style.transform = 'scaleX(-1)';
</script>
</body>
</html>
