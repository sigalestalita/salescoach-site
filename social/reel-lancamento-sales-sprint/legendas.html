<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Legendas</title>
<link rel="stylesheet" href="poppins.css">
<style>
/* Camada de legendas do vídeo narrado (fundo transparente). Lê legendas.json, gerado pelo narracao.py:
   as falas que não estão escritas na tela, cada uma no tempo em que é dita. */
html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
#leg { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); max-width: 1720px; white-space: nowrap; padding: 14px 30px; border-radius: 16px;
  background: rgba(2,5,11,.66); color: #fff; font: 500 40px/1.3 'Poppins', sans-serif; letter-spacing: -.01em; text-align: center;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08); -webkit-backdrop-filter: blur(6px); }
</style></head>
<body><div id="leg"></div>
<script>
let CUES = [];
window.ready = Promise.all([fetch('legendas.json').then(r => r.json()).then(c => CUES = c), document.fonts.ready]).then(() => true);
window.renderAt = t => { const el = document.getElementById('leg'), c = CUES.find(([a, b]) => t >= a && t < b);
  if (!c) { el.style.opacity = 0; return; }
  const [a, b, txt] = c, k = Math.min(1, (t - a) / .15, (b - t) / .15);
  if (el.textContent !== txt) el.textContent = txt; el.style.opacity = k; el.style.transform = `translateX(-50%) translateY(${(1 - k) * 8}px)`; };
</script></body></html>
