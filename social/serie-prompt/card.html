<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Carrossel Sales Coach · prompt</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="poppins.css"><link rel="stylesheet" href="instrument.css">
<style>
/* Carrossel 4:5 (1080×1350) no formato "foto real + pedido flutuando": cada card é
   uma foto, a tela do notebook recebe uma captura real do Sales Coach em perspectiva
   (matrix3d a partir dos 4 cantos medidos na foto) e o pedido aparece numa barra de
   prompt. Parâmetros na URL: ?c=1..4 (ver CARDS abaixo). */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #0b0f1f; }
body { position: relative; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
#foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
#tela { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#tela img { display: block; width: 100%; height: 100%; border-radius: 16px 16px 0 0; }
/* Brilho e sombra da tela, para casar com a luz da foto */
#tela::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 38%), linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,.08)); }
#prompt { position: absolute; left: 50%; translate: -50% 0; width: 800px; padding: 24px 28px 20px; border-radius: 34px;
  background: rgba(255,255,255,.97); box-shadow: 0 30px 60px -24px rgba(5,10,30,.55), 0 2px 0 rgba(255,255,255,.8) inset; }
#prompt p { font-size: 32px; line-height: 1.3; color: #16192a; letter-spacing: -.012em; min-height: 43px; }
#prompt .barra { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; }
#prompt .mais { width: 38px; height: 38px; color: #2c3044; }
#prompt .dir { display: flex; align-items: center; gap: 20px; }
#prompt .mic { width: 30px; height: 30px; color: #2c3044; }
#prompt .env { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(150deg, #5d7bff, #2f4fd8); box-shadow: 0 6px 14px -6px rgba(47,79,216,.8); }
#prompt .env svg { width: 26px; height: 26px; color: #fff; }
#prompt .quem { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 19px; color: #6a6f84; letter-spacing: .01em; }
#prompt .quem .ic { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(150deg, #6f8cff, #2f4fd8); display: grid; place-items: center; }
#prompt .quem .ic img { width: 17px; filter: brightness(0) invert(1); }
#legenda { position: absolute; left: 60px; right: 60px; text-align: center; color: #fff; font-size: 54px; line-height: 1.16; letter-spacing: -.02em; font-weight: 500;
  text-shadow: 0 2px 18px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.35); }
/* Card do começo */
#escuro { position: absolute; inset: 0; background: radial-gradient(80% 60% at 50% 55%, rgba(5,8,22,.25), rgba(5,8,22,.72)); }
#nota { position: absolute; left: 90px; right: 90px; top: 300px; padding: 52px 56px 46px; border-radius: 36px; background: #fbfaf7;
  box-shadow: 0 40px 80px -30px rgba(0,0,0,.75); rotate: -1.2deg; }
#nota .rot { display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono'; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: #8a8fa0; }
#nota .rot i { width: 10px; height: 10px; border-radius: 50%; background: #e2564b; }
#nota h2 { margin-top: 26px; font-family: 'Space Grotesk'; font-weight: 400; font-size: 60px; line-height: 1.04; letter-spacing: -.045em; color: #141726; }
#nota h2 em { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; font-size: 72px; letter-spacing: -.02em; color: #2f4fd8; }
#nota p { margin-top: 26px; font-size: 27px; line-height: 1.42; color: #4b5064; }
#nota .pe { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 26px; border-top: 1px solid #e8e7e1; }
#nota .pe .sc { display: flex; align-items: center; gap: 12px; font-family: 'Poppins'; font-size: 24px; color: #16264f; }
#nota .pe .sc b { font-weight: 600; } #nota .pe .sc img { height: 24px; }
#nota .pe .nx { display: flex; align-items: center; gap: 10px; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #8a8fa0; }
#nota .pe .nx svg { height: 15px; width: auto; }
</style></head>
<body>
<img id="foto" alt="">
<div id="escuro" hidden></div>
<div id="tela" hidden><img alt=""></div>
<div id="prompt" hidden>
  <div class="quem"><span class="ic"><img src="fotos/mark.png" alt=""></span>Sales Coach</div>
  <p></p>
  <div class="barra">
    <svg class="mais" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <div class="dir">
      <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span class="env"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span>
    </div>
  </div>
</div>
<div id="legenda" hidden></div>
<div id="nota" hidden>
  <div class="rot"><i></i>onde tudo começou · grou</div>
  <h2>300 reuniões por mês.<br><em>nenhuma ideia</em> do que acontecia nelas.</h2>
  <p>a gente marcava, o executivo ia, e depois só sobrava o que alguém lembrava de contar. foi dessa dor que nasceu o sales coach.</p>
  <div class="pe"><span class="sc"><img src="fotos/mark.png" alt=""><span><b>Sales</b> Coach</span></span>
    <span class="nx">um produto <svg viewBox="0 0 800 150"><path fill="none" stroke="#8a8fa0" stroke-width="14" stroke-linecap="round" d="M8 139V12L175 139V12M200 12H366M200 12V139H366M200 75H366M390 12L558 139M558 12L390 139M580 139L685 12L792 139M618 95H755"/></svg></span></div>
</div>
<script src="cards.js"></script>
<script>
const CARDS = window.CARDS || {};
const c = CARDS[new URLSearchParams(location.search).get('c') || '1'];
const $ = s => document.querySelector(s);
/* Homografia do retângulo (0,0)-(w,h) para os 4 cantos medidos na foto. */
function matrix3d(w, h, q) {
  const [[x0, y0], [x1, y1], [x2, y2], [x3, y3]] = q; // sup-esq, sup-dir, inf-dir, inf-esq
  const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2, sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
  const den = dx1 * dy2 - dx2 * dy1;
  const g = (sx * dy2 - dx2 * sy) / den, hh = (dx1 * sy - sx * dy1) / den;
  const a = x1 - x0 + g * x1, b = x3 - x0 + hh * x3, d = y1 - y0 + g * y1, e = y3 - y0 + hh * y3;
  // escala do quadrado unitário para w×h
  const m = [a / w, d / w, 0, g / w, b / h, e / h, 0, hh / h, 0, 0, 1, 0, x0, y0, 0, 1];
  return `matrix3d(${m.join(',')})`;
}
$('#foto').src = c.foto;
if (c.foto_pos) $('#foto').style.objectPosition = c.foto_pos;
if (c.tela) {
  const t = $('#tela'); t.hidden = false; t.style.width = '1200px'; t.style.height = '780px';
  t.querySelector('img').src = c.tela; t.style.transform = matrix3d(1200, 780, c.quad);
  if (c.tela_filtro) t.style.filter = c.tela_filtro;
}
if (c.prompt) { const p = $('#prompt'); p.hidden = false; p.style.top = (c.prompt_y ?? 150) + 'px'; p.querySelector('p').textContent = c.prompt; }
if (c.legenda) { const l = $('#legenda'); l.hidden = false; l.style.top = (c.legenda_y ?? 260) + 'px'; l.textContent = c.legenda; }
if (c.nota) { $('#nota').hidden = false; $('#escuro').hidden = false; }
</script>
</body></html>
