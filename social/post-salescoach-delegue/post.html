<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post Sales Coach · estilo anúncio</title>
<link rel="stylesheet" href="poppins.css">
<style>
/* Post de feed no estilo do anúncio de referência: foto cinematográfica de quem usa o produto,
   marca no topo e uma frase curta centralizada sobre a parte escura da foto.
   ?foto=homem|mulher  ?f=45 (1080×1350) ou ?f=11 (1080×1080) */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #050608; }
body { position: relative; font-family: 'Poppins', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#foto { position: absolute; inset: 0; background-size: cover; background-position: 50% 100%; }
#sombra { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3,5,8,.72) 0%, rgba(3,5,8,.45) 26%, rgba(3,5,8,0) 52%); }
#topo { position: absolute; left: 0; right: 0; top: 96px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.marca { display: flex; align-items: center; gap: 26px; }
.marca i { width: 104px; height: 104px; border-radius: 30px; background: #fff; display: grid; place-items: center; }
.marca i b { width: 66px; height: 62px; background: #071A34; -webkit-mask: url(img/mark-white.png) center / contain no-repeat; }
.marca span { font-size: 92px; font-weight: 500; letter-spacing: -.03em; line-height: 1; }
.frase { margin-top: 56px; font-size: 52px; font-weight: 400; line-height: 1.24; letter-spacing: -.02em; color: rgba(255,255,255,.94); text-shadow: 0 2px 30px rgba(0,0,0,.45); }
</style>
</head>
<body>
<div id="foto"></div><div id="sombra"></div>
<div id="topo">
  <div class="marca"><i><b></b></i><span>Sales Coach</span></div>
  <div class="frase">Seu time vende.<br>O Sales Coach faz o resto.</div>
</div>
<script>
const q = new URLSearchParams(location.search), foto = q.get('foto') || 'homem', quad = q.get('f') === '11';
document.getElementById('foto').style.backgroundImage = `url(fotos/${foto}.jpg)`;
if (quad) { document.documentElement.style.height = document.body.style.height = '1080px'; document.getElementById('topo').style.top = '70px';
  document.querySelector('.frase').style.marginTop = '40px'; }
window.ready = Promise.all([document.fonts.ready, new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = `fotos/${foto}.jpg`; })]);
</script>
</body>
</html>
