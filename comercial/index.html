<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXA Comercial</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0e0b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: ferramenta de trabalho — barra lateral de navegação, área de trabalho larga; o painel resume, as outras telas operam. */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --surface-2:#eceee6; --fg:#16170f; --soft:#555849; --mute:#80837a; --line:#dcdfd3;
  --accent:#d4f969; --accent-ink:#16170f; --accent-text:#4d5c12; --ok:#3f7d1c; --warn:#a1600a; --bad:#b3321f; --bad-bg:#fbe3df; --warn-bg:#fbefd9;
  --shadow:0 18px 50px -20px rgba(20,22,10,.35);
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0e0b; --surface:#16180f; --surface-2:#1e2117; --fg:#eceee4; --soft:#a8ac9d; --mute:#767a6c; --line:#2b2e24;
  --accent:#d4f969; --accent-ink:#0d0e0b; --accent-text:#d4f969; --ok:#9ccf5a; --warn:#f0b35a; --bad:#f08a78; --bad-bg:#3a1c16; --warn-bg:#3a2a12;
  --shadow:0 18px 50px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0e0b; --surface:#16180f; --surface-2:#1e2117; --fg:#eceee4; --soft:#a8ac9d; --mute:#767a6c; --line:#2b2e24;
  --accent:#d4f969; --accent-ink:#0d0e0b; --accent-text:#d4f969; --ok:#9ccf5a; --warn:#f0b35a; --bad:#f08a78; --bad-bg:#3a1c16; --warn-bg:#3a2a12;
  --shadow:0 18px 50px -20px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:26px;font-weight:400;letter-spacing:-.03em;text-wrap:balance}
h2{font-size:16px;font-weight:500;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
.soft{color:var(--soft)} .mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
aside.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:20px 12px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 8px}
.brand svg{width:76px;color:var(--fg)}
.brand span{font-size:12px;color:var(--soft)}
nav.tabs{display:grid;gap:2px}
nav.tabs a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--soft);text-decoration:none;font-size:14px}
nav.tabs a:hover{background:var(--surface-2);color:var(--fg)}
nav.tabs a.on{background:var(--surface-2);color:var(--fg);font-weight:500}
nav.tabs a.on::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--accent-text);margin-left:-6px;margin-right:2px}
nav.tabs a .lbl{flex:1}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.bad{background:var(--bad);color:#fff}
.side .foot{margin-top:auto;font-size:12px;color:var(--mute);padding:0 8px;line-height:1.45}
main#view{min-width:0;padding:28px clamp(16px,3vw,40px) 80px;display:grid;gap:22px;align-content:start}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside.side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand span,.side .foot{display:none}
  nav.tabs{display:flex;gap:4px}
  nav.tabs a{white-space:nowrap;padding:8px 10px}
  nav.tabs a.on::before{display:none}
}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top .sub{color:var(--soft);margin-top:4px;max-width:70ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
a.btn,a.mono{text-decoration:none;color:inherit}
.btn:hover{border-color:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.pri:hover{filter:brightness(.96)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);min-width:0}
textarea.inp{height:auto;min-height:72px;padding:8px 10px;resize:vertical;width:100%}
.inp:disabled{background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 12px;height:34px;cursor:pointer;color:var(--soft);font-size:13.5px}
.seg button.on{background:var(--surface-2);color:var(--fg);font-weight:500}

.banner{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--surface);padding:12px 14px;border-radius:8px;color:var(--soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;min-width:0;align-content:start}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpis>div{background:var(--surface);padding:16px 18px;display:grid;gap:4px;min-width:0}
.kpis b{font-size:26px;font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpis span{font-size:12.5px;color:var(--soft)}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* metas */
.meters{display:grid;gap:12px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline}
.meter .v{font-variant-numeric:tabular-nums;font-size:13.5px}
.meter .v b{font-weight:500}
.meter .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent-text);border-radius:3px}
.meter.done .bar i{background:var(--ok)}

/* listas */
.list{display:grid}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:500}
.row .d{font-size:13px;color:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.ok{background:var(--ok)} .dot.acc{background:var(--accent-text)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.chip.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad);font-weight:500}
.chip.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn);font-weight:500}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--soft);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--fg);font-weight:500}

/* kanban */
.kan-wrap{overflow-x:auto;padding-bottom:6px}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;min-width:min-content}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:180px}
.col.over{outline:2px dashed var(--accent-text);outline-offset:-2px}
.col>header{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px;gap:8px}
.col>header b{font-weight:500;font-size:13.5px}
.col>header span{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;cursor:pointer;text-align:left;width:100%}
.opp:hover{border-color:var(--soft)}
.opp.alert{border-left:3px solid var(--bad)}
.opp .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.opp .h b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .v{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.opp .s{font-size:12.5px;color:var(--soft)}
.opp .meta{display:flex;flex-wrap:wrap;gap:4px}

/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:400;color:var(--soft);text-align:left;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td .inp{height:32px;width:100%}
td .inp.small{width:84px;text-align:right}
.prio{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-weight:600;font-size:12.5px;background:var(--surface-2)}
.prio.A{background:var(--accent);color:var(--accent-ink)}
.prio.B{background:var(--surface-2);color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text)}

/* cadência */
.touch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;padding:14px 0;border-top:1px solid var(--line)}
.touch:first-child{border-top:0}
.touch .who b{font-weight:500}
.touch .what{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.touch .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:flex-start}
.touch .msg{grid-column:1/-1;background:var(--surface-2);border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:14px;line-height:1.55}
.touch .msg mark{background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:0 2px}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.dots i.done{background:var(--accent-text);box-shadow:none}
.dots i.late{background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad)}
@media (max-width:620px){.touch{grid-template-columns:1fr}.touch .acts{justify-content:flex-start}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,11,8,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:51;box-shadow:var(--shadow);display:grid;grid-template-rows:auto minmax(0,1fr) auto;border-left:1px solid var(--line)}
.drawer>header{padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.drawer>header h2{font-size:18px;font-weight:500}
.drawer .body{overflow-y:auto;padding:18px 20px;display:grid;gap:16px;align-content:start}
.drawer>footer{padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--surface)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields label{display:grid;gap:4px;font-size:12.5px;color:var(--soft);min-width:0}
.fields label.full{grid-column:1/-1}
.fields .inp{width:100%}
.fields .check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg);height:36px}
.fields .check input{width:18px;height:18px;accent-color:var(--accent-text)}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.summary div{background:var(--surface);padding:10px 12px;display:grid;gap:2px}
.summary b{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--soft)}
.sect{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:60;box-shadow:var(--shadow)}
.progress{display:flex;align-items:center;gap:12px}
.progress .bar{flex:1;max-width:360px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent-text)}
.task{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task.feito .tt{color:var(--mute);text-decoration:line-through}
.task .tt b{font-weight:500}
@media (max-width:620px){.task{grid-template-columns:1fr}}
.auth{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:24px 16px}
.auth .box{width:min(400px,100%);display:grid;gap:18px}
.auth .box svg{width:120px;color:var(--fg)}
.auth h1{font-size:24px}
.auth form{display:grid;gap:12px}
.auth label{display:grid;gap:4px;font-size:12.5px;color:var(--soft)}
.auth .inp{height:42px;width:100%;font-size:15px}
.auth .btn{height:42px;justify-content:center}
.auth .msg{font-size:13.5px;color:var(--soft);min-height:1.4em}
.auth .msg.bad{color:var(--bad)}
.auth .link{background:none;border:0;color:var(--accent-text);cursor:pointer;padding:0;font-size:13.5px;justify-self:start;text-decoration:underline}
.me{display:grid;gap:6px;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12.5px}
.me b{font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .row2{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:860px){.me{border-top:0;padding:0;display:flex;align-items:center}.me>span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 800 150" fill="none" aria-label="NEXA"><path d="M8 139V12L175 139V12M200 12H366M200 12V139H366M200 75H366M390 12L558 139M558 12L390 139M580 139L685 12L792 139M618 95H755" stroke="currentColor" stroke-width="13" stroke-linecap="round"/></svg><span>Comercial</span></div>
    <nav class="tabs" id="tabs" aria-label="Telas">
      <a href="#painel" data-v="painel"><span class="lbl">Painel</span></a>
      <a href="#cadencia" data-v="cadencia"><span class="lbl">Cadência</span><span class="badge" id="bCad" hidden></span></a>
      <a href="#pipeline" data-v="pipeline"><span class="lbl">Pipeline</span><span class="badge bad" id="bPipe" hidden></span></a>
      <a href="#contas" data-v="contas"><span class="lbl">Contas-alvo</span></a>
      <a href="#semana" data-v="semana"><span class="lbl">Semana</span></a>
      <a href="#metas" data-v="metas"><span class="lbl">Metas e preços</span></a>
      <a href="#plano" data-v="plano"><span class="lbl">Plano 90 dias</span></a>
      <a href="#ajustes" data-v="ajustes"><span class="lbl">Ajustes e importar</span></a>
      <a href="#equipe" data-v="equipe" id="navEquipe" hidden><span class="lbl">Equipe</span></a>
    </nav>
    <div class="me" id="me" hidden><span>Conectado como</span><b id="meEmail"></b><div class="row2"><button class="btn sm" id="trocarSenha">Trocar senha</button><button class="btn sm" id="sair">Sair</button></div></div>
  </aside>
  <main id="view" aria-live="polite"></main>
</div>
<div id="drawerRoot"></div>
<div class="toast" id="toast" hidden></div>
<div class="auth" id="auth">
  <div class="box">
    <svg viewBox="0 0 800 150" fill="none" aria-label="NEXA"><path d="M8 139V12L175 139V12M200 12H366M200 12V139H366M200 75H366M390 12L558 139M558 12L390 139M580 139L685 12L792 139M618 95H755" stroke="currentColor" stroke-width="12" stroke-linecap="round"/></svg>
    <div id="authBody"><p class="msg">Carregando…</p></div>
  </div>
</div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>

<script>
(() => {
/* ───────── constantes ───────── */
const STAGES = [null, 'Em cadência', 'Conversa iniciada', 'Diagnóstico agendado', 'Diagnóstico feito', 'Proposta enviada', 'Negociação', 'Ganho', 'Perdido', 'Nutrir'];
const PRODUTOS = ['Sales Coach', 'Atlas Clima', 'Atlas 360', 'Fábrica de soluções'];

const CSTATUS = { fila: 'Na fila', cadencia: 'Em cadência', oportunidade: 'Virou oportunidade', nutrir: 'Nutrir', descartada: 'Descartada' };
const DEFAULTS = {
  vendedora: '',
  precos: { scEss: 19.9, scEssImpl: 990, scPro: 29.9, scProImpl: 1690, atlas: 8, atlasImpl: 2000 },
  taxas: { resposta: .15, diagnostico: .45, proposta: .5, fechamento: .3 },
  medias: { scUsers: 12, atlasColab: 150 },
  metas: { '2026-10': { dias: 18, sc: 1, atlas: 0, fabrica: 1 }, '2026-11': { dias: 19, sc: 2, atlas: 1, fabrica: 1 }, '2026-12': { dias: 18, sc: 3, atlas: 1, fabrica: 1 } },
  probs: { 1: 0, 2: .05, 3: .1, 4: .2, 5: .4, 6: .6, 7: 1, 8: 0, 9: 0 },
  etapas: {
    1: { nome: 'Em cadência', sig: 'A conta está recebendo os toques da cadência e ainda não respondeu.', crit: 'A pessoa respondeu, aceitou conexão e trocou mensagem, ou atendeu a ligação.' },
    2: { nome: 'Conversa iniciada', sig: 'Houve troca real com alguém da conta.', crit: 'Reunião de diagnóstico marcada na agenda, com convite aceito.' },
    3: { nome: 'Diagnóstico agendado', sig: 'Reunião de 30 min marcada.', crit: 'Reunião aconteceu.' },
    4: { nome: 'Diagnóstico feito', sig: 'Entendemos a dor, quem decide e o prazo. A conta tem encaixe.', crit: 'Dor confirmada + decisor identificado + próximo passo com data (demo ou proposta).' },
    5: { nome: 'Proposta enviada', sig: 'Demo feita e proposta com valores enviada.', crit: 'O decisor viu a proposta e pediu ajuste, prazo ou condição.' },

    <section class="card"><header><h2>Pipeline aberto por etapa</h2><a class="mono soft" href="#pipeline">Ver pipeline</a></header>
      <div class="meters">${porEtapa.filter(x => x.e > 1 || x.n).map(x => `<div class="meter"><span>${stg(x.e)}</span><span class="v"><b>${x.n}</b> · ${brl(x.v)}</span><span class="bar"><i style="width:${x.n / maxV * 100}%"></i></span></div>`).join('')}</div>
    </section>`;
  },

  pipeline() {
    const q = S.busca.toLowerCase();
    const os = S.opps.filter(o => (!S.filtroProd || o.produto === S.filtroProd) && (!q || `${o.empresa} ${o.contato}`.toLowerCase().includes(q)));
    const cols = [1, 2, 3, 4, 5, 6].filter(e => e > 1 || os.some(o => o.etapa === 1)).concat(S.showClosed ? [7, 8, 9] : []);
    const card = o => { const v = valores(o), a = alerta(o);
      return `<button class="opp ${a && a.cls === 'bad' ? 'alert' : ''}" draggable="${!dis()}" data-open-opp="${o.id}" data-drag="${o.id}">
        <span class="h"><b>${esc(o.empresa)}</b><span class="v">${brl(v.ano)}</span></span>
        <span class="meta"><span class="chip">${esc(o.produto || 'Sem produto')}</span>${a ? `<span class="chip ${a.cls}">${a.txt}</span>` : ''}</span>
        <span class="s">${esc(o.proximoPasso || 'Sem próximo passo')}${o.dataProximo ? ' · ' + brShort(o.dataProximo) : ''}</span></button>`; };
    return `
    <div class="top"><div><h1>Pipeline</h1><p class="sub">Arraste o cartão para mudar de etapa, ou abra para editar. O valor é o do primeiro ano.</p></div>
      <div class="tools">
        <input class="inp" id="busca" type="search" placeholder="Buscar empresa ou contato" value="${esc(S.busca)}" aria-label="Buscar">
        <select class="inp" id="fProd" aria-label="Produto"><option value="">Todos os produtos</option>${PRODUTOS.map(p => `<option ${p === S.filtroProd ? 'selected' : ''}>${p}</option>`).join('')}</select>
        <button class="btn" id="tClosed">${S.showClosed ? 'Ocultar fechadas' : 'Ver ganhas, perdidas e nutrir'}</button>
        ${S.dl ? `<button class="btn" id="expOpp">Exportar CSV</button>` : ''}
        <button class="btn pri" id="newOpp" ${dis()}>+ Oportunidade</button>
      </div></div>
    ${!S.opps.length ? `<div class="empty"><b>Nenhuma oportunidade ainda.</b><span>Quando uma conta responder na cadência, use “Respondeu” para trazê-la para cá. Ou crie uma direto.</span></div>` : ''}
    <div class="kan-wrap"><div class="kan">${cols.map(e => { const cs = os.filter(o => o.etapa === e); const tot = cs.reduce((s, o) => s + valores(o).ano, 0);
      return `<section class="col" data-drop="${e}"><header><b>${stg(e)}</b><span>${cs.length} · ${brl(tot)}</span></header>${cs.sort((a, b) => (a.dataProximo || '9').localeCompare(b.dataProximo || '9')).map(card).join('')}</section>`; }).join('')}</div></div>`;
  },

  contas() {
    const q = S.busca.toLowerCase();
    let cs = S.contas.map(c => ({ c, n: notas(c) }));
    if (S.contaFiltro === 'abertas') cs = cs.filter(x => ['fila', 'cadencia', undefined, ''].includes(x.c.status));
    else if (S.contaFiltro) cs = cs.filter(x => x.c.status === S.contaFiltro);
    if (S.contaPrio) cs = cs.filter(x => x.n.prio === S.contaPrio);
    if (q) cs = cs.filter(x => `${x.c.empresa} ${x.c.decisor}`.toLowerCase().includes(q));
    cs.sort((a, b) => a.n.prio.localeCompare(b.n.prio) || Math.max(b.n.sc, b.n.at) - Math.max(a.n.sc, a.n.at));
    const nA = S.contas.filter(c => notas(c).prio !== 'C' && (c.status || 'fila') === 'fila').length;
    return `
    <div class="top"><div><h1>Contas-alvo</h1><p class="sub">Pesquise antes de abordar. A nota de encaixe vai de 0 a 5 e define a prioridade. Só coloque em cadência contas A ou B. ${nA ? `<b>${nA}</b> na fila com prioridade A ou B.` : ''}</p></div>
      <div class="tools">
        <input class="inp" id="busca" type="search" placeholder="Buscar" value="${esc(S.busca)}" aria-label="Buscar">
        <select class="inp" id="fStatus" aria-label="Situação"><option value="abertas" ${S.contaFiltro === 'abertas' ? 'selected' : ''}>Na fila e em cadência</option><option value="" ${!S.contaFiltro ? 'selected' : ''}>Todas</option>${Object.entries(CSTATUS).map(([k, v]) => `<option value="${k}" ${S.contaFiltro === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <div class="seg" role="group" aria-label="Prioridade">${['', 'A', 'B', 'C'].map(p => `<button data-prio="${p}" class="${S.contaPrio === p ? 'on' : ''}">${p || 'Todas'}</button>`).join('')}</div>
        ${S.dl ? `<button class="btn" id="expContas">Exportar CSV</button>` : ''}
        <button class="btn pri" id="newConta" ${dis()}>+ Conta</button>
      </div></div>
    ${!S.contas.length ? `<div class="empty"><b>Nenhuma conta cadastrada.</b><span>Comece pelas empresas do cliente ideal: 5 a 50 vendedores que vendem por videochamada (Sales Coach) ou 50 a 1.000 pessoas com RH estruturado (Atlas).</span></div>` :
    `<div class="tw"><table><thead><tr><th>Prioridade</th><th>Empresa</th><th>Segmento</th><th class="n">Sales Coach</th><th class="n">Atlas</th><th>Produto</th><th>Decisor</th><th>Situação</th><th></th></tr></thead><tbody>
      ${cs.map(({ c, n }) => `<tr class="click" data-open-conta="${c.id}"><td><span class="prio ${n.prio}">${n.prio}</span></td><td><b style="font-weight:500">${esc(c.empresa)}</b></td><td>${esc(c.segmento)}</td><td class="n">${n.sc}</td><td class="n">${n.at}</td><td>${esc(produtoConta(c))}</td><td>${esc(c.decisor)}${c.cargo ? `<div class="mute" style="font-size:12px">${esc(c.cargo)}</div>` : ''}</td><td>${CSTATUS[c.status || 'fila']}${c.status === 'cadencia' ? ` <span class="mute">· ${(c.toques || []).length}/${cad().length}</span>` : ''}</td>
        <td class="n">${(c.status || 'fila') === 'fila' && n.prio !== 'C' && !dis() ? `<button class="btn sm" data-start="${c.id}">Iniciar cadência</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="9" class="mute">Nenhuma conta com esse filtro.</td></tr>`}
    </tbody></table></div>`}`;
  },

  cadencia() {
    const th = toquesHoje(), em = S.contas.filter(c => c.status === 'cadencia');
    const futuras = em.filter(c => { const t = proximoToque(c); return t && t.due > hoje(); }).sort((a, b) => proximoToque(a).due.localeCompare(proximoToque(b).due));
    const terminadas = em.filter(c => !proximoToque(c));
    const tmpl = (c, t) => { const nome = (c.decisor || '').trim().split(/\s+/)[0];
      return esc(((isAtlas(produtoConta(c)) ? t.atlas : t.sc) || t.sc || '').replaceAll('{nome}', nome || '[nome]').replaceAll('{empresa}', c.empresa || '[empresa]').replaceAll('{eu}', S.cfg.vendedora || '[seu nome]')).replace(/\[[^\]]+\]/g, m => `<mark>${m}</mark>`); };
    const dots = c => `<span class="dots" aria-label="${(c.toques || []).length} de ${cad().length} toques">${toques(c).map(t => `<i class="${t.done ? 'done' : t.late ? 'late' : ''}" title="Dia ${t.d} · ${t.canal}"></i>`).join('')}</span>`;
    const item = ({ c, t }) => { const key = c.id + ':' + t.d, open = S.openMsg === key;
      return `<div class="touch"><div><div class="who"><b>${esc(c.empresa)}</b> <span class="soft">· ${esc(c.decisor || 'sem decisor')}${c.cargo ? ', ' + esc(c.cargo) : ''}</span></div>
        <div class="what"><span class="chip acc">Dia ${t.d} · ${t.canal}</span><span>${t.acao}</span>${t.due < hoje() ? `<span class="chip bad">atrasado ${diff(hoje(), t.due)}d</span>` : ''}<span class="chip">${esc(isAtlas(produtoConta(c)) ? 'Atlas' : 'Sales Coach')}</span>${dots(c)}</div></div>
        <div class="acts"><button class="btn sm" data-msg="${key}">${open ? 'Fechar mensagem' : 'Ver mensagem'}</button>
          ${c.linkedin ? `<a class="btn sm" href="${esc(/^https?:\/\//.test(c.linkedin) ? c.linkedin : 'https://' + c.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>` : ''}
          <button class="btn sm pri" data-done="${key}" ${dis()}>Feito</button><button class="btn sm" data-resp="${c.id}" ${dis()}>Respondeu</button></div>
        ${open ? `<div class="msg" id="msg-${esc(key)}">${tmpl(c, t)}</div><div><button class="btn sm" data-copy="${key}">Copiar mensagem</button></div>` : ''}</div>`; };
    return `
    <div class="top"><div><h1>Cadência</h1><p class="sub">${cad().length ? cad()[cad().length - 1].d : 0} dias, ${cad().length} toques. Edite a sequência e as mensagens em Ajustes. A mensagem já vem com o nome e a empresa; troque o que está destacado. Quando a pessoa responder em qualquer canal, clique em “Respondeu”.</p></div></div>
    <section class="card"><header><h2>Toques de hoje</h2><span class="mono soft">${th.length}</span></header>
      ${th.length ? `<div>${th.map(item).join('')}</div>` : `<div class="empty"><b>Nenhum toque para hoje.</b><span>${em.length ? 'Os próximos toques aparecem abaixo.' : 'Inicie a cadência de contas A ou B em Contas-alvo.'}</span></div>`}
    </section>
    ${terminadas.length ? `<section class="card"><header><h2>Cadência concluída sem resposta</h2></header><div class="list">${terminadas.map(c => `<div class="row"><span class="dot warn"></span><div><div class="t">${esc(c.empresa)}</div><div class="d">Todos os toques feitos. Mova para Nutrir e volte em 60 dias com um motivo novo.</div></div><div class="tools"><button class="btn sm" data-resp="${c.id}" ${dis()}>Respondeu</button><button class="btn sm" data-nutrir="${c.id}" ${dis()}>Nutrir</button></div></div>`).join('')}</div></section>` : ''}
    ${futuras.length ? `<section class="card"><header><h2>Próximos toques</h2><span class="mono soft">${futuras.length} em cadência</span></header><div class="list">${futuras.map(c => { const t = proximoToque(c); return `<div class="row"><span class="dot"></span><div><div class="t">${esc(c.empresa)}</div><div class="d">Dia ${t.d} · ${t.canal} · ${brShort(t.due)}</div></div><div class="tools">${dots(c)}<button class="btn sm" data-resp="${c.id}" ${dis()}>Respondeu</button></div></div>`; }).join('')}</div></section>` : ''}`;
  },

  semana() {
    const h = hoje(), ini = '2026-09-28', fim = mondayOf(h > '2026-12-28' ? h : '2026-12-28');
    const ws = []; for (let w = ini; w <= fim; w = addDays(w, 7)) ws.push(w);
    const H = (o, k) => (o.hist || {})[k];
    const cnt = (a, b) => ({ contas: S.contas.filter(c => inPeriod(c.inicioCadencia, a, b)).length, resp: S.opps.filter(o => inPeriod(H(o, 2), a, b)).length, diag: S.opps.filter(o => inPeriod(H(o, 4), a, b)).length, prop: S.opps.filter(o => inPeriod(H(o, 5), a, b)).length, gan: S.opps.filter(o => inPeriod(H(o, 7), a, b)).length });
    return `
    <div class="top"><div><h1>Semana</h1><p class="sub">Preencha na quarta, no fim do dia, para a reunião de quinta às 9h. Contas novas, respostas, diagnósticos, propostas e contratos são contados sozinhos a partir da cadência e do pipeline.</p></div></div>
    <div class="tw"><table><thead><tr><th>Semana</th><th class="n">Meta contas</th><th class="n">Contas novas</th><th class="n">Atingido</th><th class="n">Ligações</th><th class="n">Conexões aceitas</th><th class="n">Respostas</th><th class="n">Diagnósticos</th><th class="n">Propostas</th><th class="n">Contratos</th><th>Aprendizado da semana</th></tr></thead><tbody>
    ${ws.slice().reverse().map(w => { const e = addDays(w, 6), mk = addDays(w, 3).slice(0, 7), meta = S.cfg.metas[mk] ? funil(mk).porDia * 5 : 0, c = cnt(w, e), s = S.semanas[w] || {}, at = meta ? c.contas / meta : 0, cur = w === mondayOf(h);
      return `<tr${cur ? ' style="background:var(--surface-2)"' : ''}><td><b style="font-weight:500">${brShort(w)}–${brShort(e)}</b>${cur ? ' <span class="chip acc">atual</span>' : ''}</td><td class="n">${meta || '–'}</td><td class="n">${c.contas}</td>
        <td class="n">${meta ? `<span class="chip ${at >= 1 ? 'acc' : at < .7 && w <= h ? 'bad' : ''}">${pct(at)}</span>` : '–'}</td>
        <td class="n"><input class="inp small" type="number" min="0" id="lig-${w}" data-sem="${w}" data-f="ligacoes" value="${esc(s.ligacoes ?? '')}" ${dis()} aria-label="Ligações"></td>
        <td class="n"><input class="inp small" type="number" min="0" id="con-${w}" data-sem="${w}" data-f="conexoes" value="${esc(s.conexoes ?? '')}" ${dis()} aria-label="Conexões aceitas"></td>
        <td class="n">${c.resp}</td><td class="n">${c.diag}</td><td class="n">${c.prop}</td><td class="n">${c.gan}</td>
        <td style="min-width:260px"><input class="inp" id="apr-${w}" data-sem="${w}" data-f="aprendizado" value="${esc(s.aprendizado ?? '')}" ${dis()} aria-label="Aprendizado"></td></tr>`; }).join('')}
    </tbody></table></div>`;
  },

  metas() {
    const c = S.cfg, ks = Object.keys(c.metas).sort();
    const f = (path, val, kind, extra = '') => `<input class="inp" style="width:100%" type="number" step="any" id="cfg-${path.replaceAll('.', '-')}" data-cfg="${path}" data-kind="${kind}" value="${kind === 'pct' ? Math.round(val * 1000) / 10 : val}" ${dis()} ${extra}>`;
    return `
    <div class="top"><div><h1>Metas e preços</h1><p class="sub">As taxas de conversão começam conservadoras. Depois de 4 semanas, troque pelas reais: as metas diárias e o painel se recalculam. Cada campo salva ao sair dele.</p></div></div>
    <div class="grid2">
      <section class="card"><header><h2>Taxas de conversão</h2></header>
        <div class="fields">
          <label>Contas abordadas que respondem (%)${f('taxas.resposta', c.taxas.resposta, 'pct')}</label>
          <label>Respostas que viram diagnóstico (%)${f('taxas.diagnostico', c.taxas.diagnostico, 'pct')}</label>
          <label>Diagnósticos que viram proposta (%)${f('taxas.proposta', c.taxas.proposta, 'pct')}</label>
          <label>Propostas que fecham (%)${f('taxas.fechamento', c.taxas.fechamento, 'pct')}</label>
          <label>Usuários por contrato de Sales Coach (média)${f('medias.scUsers', c.medias.scUsers, 'num')}</label>
          <label>Colaboradores por contrato de Atlas (média)${f('medias.atlasColab', c.medias.atlasColab, 'num')}</label>
          <label class="full">Seu nome, para as mensagens da cadência<input class="inp" id="cfg-vendedora" data-cfg="vendedora" data-kind="txt" value="${esc(c.vendedora)}" ${dis()} placeholder="Nome e sobrenome"></label>
        </div>
        <p class="mute" style="font-size:12.5px">Conversão total de conta abordada para contrato: ${(c.taxas.resposta * c.taxas.diagnostico * c.taxas.proposta * c.taxas.fechamento * 100).toFixed(2).replace('.', ',')}%.</p>
      </section>
      <section class="card"><header><h2>Preços</h2><span class="chip warn">Atlas a confirmar</span></header>
        <div class="fields">
          <label>Sales Coach Essencial, por usuário/mês (1 a 10)${f('precos.scEss', c.precos.scEss, 'num')}</label>
          <label>Implantação Essencial${f('precos.scEssImpl', c.precos.scEssImpl, 'num')}</label>
          <label>Sales Coach Profissional, por usuário/mês (11 a 50)${f('precos.scPro', c.precos.scPro, 'num')}</label>
          <label>Implantação Profissional${f('precos.scProImpl', c.precos.scProImpl, 'num')}</label>
          <label>Atlas, por colaborador/mês${f('precos.atlas', c.precos.atlas, 'num')}</label>
          <label>Implantação Atlas${f('precos.atlasImpl', c.precos.atlasImpl, 'num')}</label>
        </div>
        <p class="mute" style="font-size:12.5px">Acima de 50 usuários é Enterprise, negociado com os sócios. Fábrica: valor por projeto, informado na oportunidade.</p>
      </section>
    </div>
    <section class="card"><header><h2>Metas por mês e atividade necessária</h2><button class="btn sm" id="addMes" ${dis()}>+ Mês</button></header>
      <div class="tw"><table><thead><tr><th>Mês</th><th class="n">Dias úteis</th><th class="n">Sales Coach</th><th class="n">Atlas</th><th class="n">Fábrica</th><th class="n">Propostas</th><th class="n">Diagnósticos</th><th class="n">Respostas</th><th class="n">Contas novas</th><th class="n">Por dia</th><th class="n">Mensalidade nova</th><th class="n">Implantações</th><th></th></tr></thead><tbody>
      ${ks.map(k => { const r = funil(k), m = c.metas[k], inp = (fld) => `<input class="inp small" type="number" min="0" id="m-${k}-${fld}" data-cfg="metas.${k}.${fld}" data-kind="num" value="${m[fld] ?? 0}" ${dis()} aria-label="${fld}">`;
        return `<tr><td><b style="font-weight:500">${mesLabel(k)}</b></td><td class="n">${inp('dias')}</td><td class="n">${inp('sc')}</td><td class="n">${inp('atlas')}</td><td class="n">${inp('fabrica')}</td><td class="n">${r.propostas}</td><td class="n">${r.diags}</td><td class="n">${r.resp}</td><td class="n">${r.contas}</td><td class="n"><span class="chip acc">${r.porDia}</span></td><td class="n">${brl(r.mrr)}</td><td class="n">${brl(r.impl)}</td><td class="n"><button class="btn sm" data-delmes="${k}" ${dis()} aria-label="Remover ${mesLabel(k)}">Remover</button></td></tr>`; }).join('')}
      </tbody></table></div>
    </section>`;
  },

  ajustes() {
    const c = S.cfg, d = dis(), im = S.imp;
    const chip = (lista, v, i) => `<span class="chip" style="gap:6px">${esc(v)}<button class="btn sm" style="height:20px;padding:0 6px;border:0" data-listdel="${lista}:${i}" ${d} aria-label="Remover ${esc(v)}">×</button></span>`;
    const lista = (k, tit) => `<div style="display:grid;gap:8px"><h2>${tit}</h2><div style="display:flex;flex-wrap:wrap;gap:6px">${c.listas[k].map((v, i) => chip(k, v, i)).join('')}</div>
      <div class="tools"><input class="inp" id="listadd-${k}" placeholder="Novo item" ${d}><button class="btn sm" data-listadd="${k}" ${d}>Adicionar</button></div></div>`;
    const cs = c.cadencia.map((t, i) => ({ t, i })).sort((a, b) => a.t.d - b.t.d);
    return `
    <div class="top"><div><h1>Ajustes e importar</h1><p class="sub">Tudo o que vinha da planilha: etapas, listas, cadência e mensagens. Cada campo salva ao sair dele.</p></div></div>
    <section class="card"><header><h2>Importar da planilha</h2><span class="mono soft">.xlsx</span></header>
      <p class="soft">Escolha o arquivo <b>NEXA_operacao_comercial.xlsx</b> preenchido. O sistema lê as abas Pipeline, Contas-alvo, Atividades, Metas e funil, Preços, Etapas e Plano 90 dias. Linhas de EXEMPLO e empresas que já existem aqui são ignoradas.</p>
      <div class="tools"><input type="file" id="impFile" accept=".xlsx,.xls" ${d}></div>
      ${im ? (im.erro ? `<p class="banner">${esc(im.erro)}</p>` : `<div class="list">
        ${[['opps', 'oportunidades novas', im.opps.length, im.dupOpp], ['contas', 'contas-alvo novas', im.contas.length, im.dupConta], ['semanas', 'semanas de atividades', im.semanas.length]].map(([k, l, n, dup]) => `<label class="row" style="grid-template-columns:auto minmax(0,1fr)"><input type="checkbox" id="imp-${k}" ${n ? 'checked' : 'disabled'}><span><b style="font-weight:500">${n}</b> ${l}${dup ? ` <span class="mute">· ${dup} já existem e serão ignoradas</span>` : ''}</span></label>`).join('')}
        <label class="row" style="grid-template-columns:auto minmax(0,1fr)"><input type="checkbox" id="imp-cfg" ${im.cfg ? '' : 'disabled'}><span>Metas, taxas, preços e etapas da planilha <span class="mute">· substitui os atuais</span></span></label>
        <label class="row" style="grid-template-columns:auto minmax(0,1fr)"><input type="checkbox" id="imp-tarefas" ${im.tarefas.length ? '' : 'disabled'}><span><b style="font-weight:500">${im.tarefas.length}</b> tarefas do plano de 90 dias <span class="mute">· substitui o plano atual</span></span></label>
      </div><div class="tools"><button class="btn pri" id="impGo" ${d} ${S.importando ? 'disabled' : ''}>${S.importando ? 'Importando…' : 'Importar'}</button><button class="btn" id="impCancel">Cancelar</button><span class="soft" id="impProg"></span></div>`) : ''}
    </section>
    <section class="card"><header><h2>Etapas do funil</h2></header>
      <p class="soft">A ordem é fixa: 7 é sempre Ganho, 8 Perdido e 9 Nutrir. Os nomes, as definições e a probabilidade são editáveis.</p>
      <div class="tw"><table><thead><tr><th>#</th><th>Nome</th><th>O que significa</th><th>Critério para avançar</th><th class="n">Probabilidade (%)</th></tr></thead><tbody>
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(e => `<tr><td class="n">${e}</td>
        <td style="min-width:170px"><input class="inp" id="et-${e}-nome" data-cfg="etapas.${e}.nome" data-kind="txt" value="${esc(c.etapas[e].nome)}" ${d}></td>

}
const norm = v => String(v ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
function asDate(v) {
  if (v instanceof Date && !isNaN(v)) return iso(new Date(v.getTime() + 12 * 36e5));
  if (typeof v === 'number' && v > 30000) { const d = new Date(Math.round((v - 25569) * 864e5) + 12 * 36e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;

  const H = rows[hi].map(norm);

}
const pick = (o, test) => { for (const k in o) if (test(k)) return o[k]; return ''; };
const cell = (ws, a) => ws && ws[a] ? ws[a].v : undefined;
const MES_N = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };

    const valido = o => { const e = String(o.empresa || '').trim(); return e && !/^exemplo/i.test(e); };
    const exO = new Set(S.opps.map(o => norm(o.empresa))), exC = new Set(S.contas.map(c => norm(c.empresa)));
    let opps = [], contas = [], semanas = [], tarefas = [], cfg = null, dupOpp = 0, dupConta = 0;
    if (sh('Pipeline')) opps = tabela(sh('Pipeline'), 'empresa').map(r => {

      const o = { empresa: String(pick(r, k => k === 'empresa')).trim(), segmento: String(pick(r, k => k === 'segmento')), produto: String(pick(r, k => k === 'produto')), contato: String(pick(r, k => k === 'contato')), cargo: String(pick(r, k => k === 'cargo')),

    if (sh('Contas-alvo')) { const ST = { 'na fila': 'fila', 'em cadencia': 'cadencia', 'virou oportunidade': 'oportunidade', 'descartada': 'descartada', 'nutrir': 'nutrir' };
      contas = tabela(sh('Contas-alvo'), 'empresa').map(r => { const st = ST[norm(pick(r, k => k === 'status'))] || 'fila';
        const c = { empresa: String(pick(r, k => k === 'empresa')).trim(), site: String(pick(r, k => k.startsWith('site'))), segmento: String(pick(r, k => k === 'segmento')), cidade: String(pick(r, k => k === 'cidade')),
          vendedores: numOr(pick(r, k => k.includes('vendedores'))), online: sim(pick(r, k => k.includes('reuniao online'))), crm: sim(pick(r, k => k.startsWith('usa crm'))),
          colaboradores: numOr(pick(r, k => k.includes('colaboradores'))), rh: sim(pick(r, k => k.includes('rh estruturado'))), gatilho: String(pick(r, k => k.startsWith('gatilho'))),
          decisor: String(pick(r, k => k === 'decisor')), cargo: String(pick(r, k => k === 'cargo')), linkedin: String(pick(r, k => k.includes('linkedin do decisor'))), produto: '', status: st, obs: '' };
        if (st === 'cadencia') { c.inicioCadencia = hoje(); c.toques = []; } return c; }).filter(valido).filter(c => exC.has(norm(c.empresa)) ? (dupConta++, false) : true); }
    if (sh('Atividades')) semanas = tabela(sh('Atividades'), 'semana (segunda)').map(r => ({ w: asDate(pick(r, k => k.startsWith('semana'))), ligacoes: numOr(pick(r, k => k.startsWith('ligacoes'))), conexoes: numOr(pick(r, k => k.startsWith('conexoes'))), aprendizado: String(pick(r, k => k.startsWith('aprendizado')) || '').trim() }))

async function importar() {

/* ───────── banco (Supabase) ───────── */
function criarDb(sb) {
  const cache = new Map(), subs = new Set(); let pronto = false;
  const segs = p => p.split('/');
  const notify = () => subs.forEach(fn => fn());
  const snap = path => { const d = cache.get(path); return { id: segs(path).pop(), exists: d !== undefined, data: () => d === undefined ? undefined : JSON.parse(JSON.stringify(d)), metadata: {} }; };
  const erro = e => ({ code: /row-level security|permission|42501/i.test((e && (e.message || e.code)) || '') ? 'invalid_argument' : 'unavailable', message: e && e.message });
  const novoId = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 20) : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  const espera = ms => new Promise(r => setTimeout(r, ms));
  async function comRetentativa(fn) {
    for (let t = 0; ; t++) { const res = await fn(); if (!res.error || t >= 2 || !/fetch|network|Failed/i.test(res.error.message || '')) return res; await espera(600 * (t + 1)); }
  }
  async function carregar() {
    const todos = [];
    for (let de = 0; ; de += 1000) { const { data, error } = await comRetentativa(() => sb.from('docs').select('path,data').order('path').range(de, de + 999)); if (error) throw error; todos.push(...data); if (data.length < 1000) break; }
    cache.clear(); todos.forEach(r => cache.set(r.path, r.data)); pronto = true; notify();
  }
  sb.channel('docs-mudancas').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
    if (p.eventType === 'DELETE') { if (p.old && p.old.path) cache.delete(p.old.path); } else if (p.new && p.new.path) cache.set(p.new.path, p.new.data);
    notify();
  }).subscribe(st => { if (st === 'SUBSCRIBED' && pronto) carregar().catch(() => {}); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && pronto) carregar().catch(() => {}); });
  const docRef = path => ({ id: segs(path).pop(), path,
    async set(d) { const ant = cache.get(path); cache.set(path, d); notify();
      const { error } = await comRetentativa(() => sb.from('docs').upsert({ path, data: d }, { onConflict: 'path' }));
      if (error) { if (ant === undefined) cache.delete(path); else cache.set(path, ant); notify(); throw erro(error); } },
    async delete() { const ant = cache.get(path); cache.delete(path); notify();
      const { error } = await comRetentativa(() => sb.from('docs').delete().eq('path', path));
      if (error) { if (ant !== undefined) cache.set(path, ant); notify(); throw erro(error); } },
    onSnapshot(fn) { const s2 = () => pronto && fn(snap(path)); subs.add(s2); s2(); return () => subs.delete(s2); },
    collection: sub => colRef(path + '/' + sub) });
  const colRef = path => ({ path, doc: id => docRef(path + '/' + (id || novoId())),
    onSnapshot(fn) { const n = segs(path).length + 1; const s2 = () => { if (!pronto) return; const docs = [...cache.keys()].filter(k => k.startsWith(path + '/') && segs(k).length === n).sort().map(snap); fn({ docs, size: docs.length, empty: !docs.length }); };
      subs.add(s2); s2(); return () => subs.delete(s2); } });
  return { doc: docRef, collection: colRef, carregar, comRetentativa };
}

/* ───────── login ───────── */
const CFG = window.NEXA_CONFIG || {};
const sb = window.supabase && CFG.url && !/COLE_AQUI/.test(CFG.url) ? window.supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }) : null;
const authBox = $('#authBody');
function mostrarAuth(html) { $('#auth').hidden = false; authBox.innerHTML = html; const f = $('#auth input'); f && f.focus(); }
function telaLogin(msg = '', bad = false) {
  mostrarAuth(`<h1>Entrar</h1><form id="fLogin">
    <label>E-mail<input class="inp" type="email" id="lg-email" autocomplete="username" required></label>
    <label>Senha<input class="inp" type="password" id="lg-senha" autocomplete="current-password" required></label>
    <button class="btn pri" type="submit">Entrar</button>
    <p class="msg ${bad ? 'bad' : ''}" id="lg-msg" aria-live="polite">${esc(msg)}</p>
    <button class="link" type="button" id="lg-esqueci">Esqueci minha senha</button></form>`);
  $('#fLogin').addEventListener('submit', async e => { e.preventDefault(); const m = $('#lg-msg'); m.className = 'msg'; m.textContent = 'Entrando…';
    const { error } = await sb.auth.signInWithPassword({ email: $('#lg-email').value.trim().toLowerCase(), password: $('#lg-senha').value });
    if (error) { m.className = 'msg bad'; m.textContent = /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar. Tente de novo.'; } });
  $('#lg-esqueci').addEventListener('click', async () => { const em = $('#lg-email').value.trim().toLowerCase(), m = $('#lg-msg');
    if (!em) { m.className = 'msg bad'; m.textContent = 'Digite seu e-mail acima e clique de novo.'; $('#lg-email').focus(); return; }
    const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
    m.className = error ? 'msg bad' : 'msg'; m.textContent = error ? 'Não foi possível enviar agora. Peça a um administrador para redefinir sua senha.' : 'Se o e-mail estiver cadastrado, você receberá um link para criar uma nova senha.'; });
}
function telaNovaSenha(titulo, aposSalvar) {
  mostrarAuth(`<h1>${esc(titulo)}</h1><form id="fSenha">
    <label>Nova senha (mínimo 8 caracteres)<input class="inp" type="password" id="ns-1" autocomplete="new-password" minlength="8" required></label>
    <label>Repita a nova senha<input class="inp" type="password" id="ns-2" autocomplete="new-password" minlength="8" required></label>
    <button class="btn pri" type="submit">Salvar senha</button><p class="msg" id="ns-msg" aria-live="polite"></p>
    ${aposSalvar ? '<button class="link" type="button" id="ns-cancel">Cancelar</button>' : ''}</form>`);
  $('#fSenha').addEventListener('submit', async e => { e.preventDefault(); const a = $('#ns-1').value, b = $('#ns-2').value, m = $('#ns-msg');
    if (a.length < 8) { m.className = 'msg bad'; m.textContent = 'Use pelo menos 8 caracteres.'; return; }
    if (a !== b) { m.className = 'msg bad'; m.textContent = 'As duas senhas não são iguais.'; return; }
    m.className = 'msg'; m.textContent = 'Salvando…';
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) { m.className = 'msg bad'; m.textContent = /different|same/i.test(error.message) ? 'A nova senha precisa ser diferente da atual.' : 'Não foi possível salvar. Tente de novo.'; return; }
    toast('Senha alterada'); history.replaceState(null, '', location.pathname + (location.hash.length > 1 && !/access_token|type=/.test(location.hash) ? location.hash : '#painel'));
    if (aposSalvar) { $('#auth').hidden = true; } else { location.reload(); } });
  $('#ns-cancel') && $('#ns-cancel').addEventListener('click', () => { $('#auth').hidden = true; });
}
function abrirTrocaSenha() { telaNovaSenha('Trocar senha', true); }
function telaNegado(email) {
  mostrarAuth(`<h1>Acesso ainda não liberado</h1><p class="soft">O login <b>${esc(email)}</b> existe, mas ainda não está na equipe do sistema. Peça a um administrador para incluir este e-mail na tela Equipe.</p><button class="btn" id="ng-sair">Sair</button>`);
  $('#ng-sair').addEventListener('click', () => sb.auth.signOut().then(() => location.reload()));
}
async function carregarMembros() { if (S.papel !== 'admin') return; const { data } = await sb.from('membros').select('email,nome,papel').order('email'); S.membros = data || []; schedule(); }
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fMembro') return; e.preventDefault();
  const fd = new FormData(e.target), email = String(fd.get('email')).trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Digite um e-mail válido.');
  const { error } = await sb.from('membros').upsert({ email, nome: String(fd.get('nome')).trim(), papel: fd.get('papel') }, { onConflict: 'email' });
  if (error) return toast('Não foi possível incluir.');
  toast('Incluída. Agora crie o login no Supabase com este e-mail.'); e.target.reset(); carregarMembros();
});

let iniciado = null;
async function iniciar(session) {
  if (iniciado === session.user.id) return; iniciado = session.user.id;
  S.email = (session.user.email || '').toLowerCase(); $('#meEmail').textContent = S.email; $('#me').hidden = false;
  let mb = null, error = null;
  for (let t = 0; t < 3; t++) { ({ data: mb, error } = await sb.from('membros').select('papel,nome').eq('email', S.email).maybeSingle()); if (!error) break; await new Promise(r => setTimeout(r, 700 * (t + 1))); }
  if (error) { S.noDb = true; $('#auth').hidden = true; return render(); }
  if (!mb) { iniciado = null; return telaNegado(S.email); }
  S.papel = mb.papel; S.ro = mb.papel === 'leitura'; $('#navEquipe').hidden = mb.papel !== 'admin';
  S.dl = { save: ({ filename, data }) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); return Promise.resolve(); } };
  const db = criarDb(sb); S.db = db; $('#auth').hidden = true; render();
  const tentarCarregar = async () => { try { await db.carregar(); if (S.noDb) { S.noDb = false; render(); } } catch (er) { S.noDb = true; render(); setTimeout(tentarCarregar, 5000); } };
  await tentarCarregar();
  const done = () => { S.loaded++; schedule(); };
  let f1 = 0, f2 = 0, f3 = 0, f4 = 0, f5 = 0;
  db.doc('config/geral').onSnapshot(s => { S.cfgExists = s.exists; S.cfg = deep(DEFAULTS, s.exists ? s.data() : {}); if (!f1++) done(); else schedule(); });
  db.collection('oportunidades').onSnapshot(s => { S.opps = s.docs.map(d => ({ ...d.data(), id: d.id })); if (!f2++) done(); else schedule(); });
  db.collection('contas').onSnapshot(s => { S.contas = s.docs.map(d => ({ ...d.data(), id: d.id })); if (!f3++) done(); else schedule(); });
  db.collection('semanas').onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); S.semanas = o; if (!f4++) done(); else schedule(); });
  db.collection('tarefas').onSnapshot(s => { S.tarefas = s.docs.map(d => ({ ...d.data(), id: d.id })); if (!f5++) done(); else schedule(); });
  carregarMembros();
}

/* ───────── início ───────── */
render();
if (!sb) mostrarAuth('<h1>Falta configurar</h1><p class="soft">Preencha o endereço e a chave pública do Supabase no arquivo <b>config.js</b> e publique de novo.</p>');
else {
  let recuperando = /type=(recovery|invite)/.test(location.hash);
  sb.auth.onAuthStateChange((ev, session) => setTimeout(() => {
    if (ev === 'PASSWORD_RECOVERY' || (recuperando && session)) { recuperando = false; return telaNovaSenha('Crie sua nova senha', false); }
    if (ev === 'SIGNED_OUT' || !session) { iniciado = null; return telaLogin(); }
    if (ev === 'INITIAL_SESSION' || ev === 'SIGNED_IN') iniciar(session);
  }, 0));
}
})();
</script>
</body>
</html>
